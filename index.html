.frame.x2{border-width:12px;border-image-width:12px}
.lbl{font-family:var(--display);font-size:8px;letter-spacing:0;text-transform:uppercase;color:var(--muted)}
.lbl.foe{color:var(--foe-hi)} .lbl.you{color:var(--you-hi)}
.num{font-family:var(--display);color:var(--fg);font-size:8px}
.bar{height:12px;border:2px solid var(--fg);background:#0c0a0c;position:relative;overflow:hidden}
.bar i{display:block;height:100%;transition:width .15s}
.bar.foe i{background:var(--foe)} .bar.you i{background:var(--you)}
.bar::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(0,0,0,.5) calc(10% - 2px) 10%);pointer-events:none}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:4px 6px}
.side{display:flex;align-items:center;gap:8px;min-width:0}
.portrait{width:28px;height:28px;image-rendering:pixelated;flex:none;display:block}
.bars{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.timer{font-family:var(--display);font-size:16px;text-align:center;line-height:1.3;color:var(--fg-hi)}
.timer small{display:block;font-size:7px;color:var(--muted);letter-spacing:.05em;min-height:9px;text-shadow:none}
.timer.sd{color:var(--foe-hi)} .timer.sd small{color:var(--foe-hi)}
.ctrls{display:flex;justify-content:flex-end;gap:5px}
.ib{font-family:var(--display);font-size:8px;border:2px solid var(--fg);background:var(--panel);color:var(--fg);padding:0 6px;cursor:pointer;min-width:36px;min-height:34px}
.ib:hover{background:#1c1922}
.ib:active{background:var(--fg);color:var(--o)}

@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-2px)}100%{transform:translate(0,0)}}

.bottom{display:flex;flex-direction:column;gap:8px}
.mana{display:flex;align-items:center;gap:8px;padding:4px 8px}
.segs{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:3px}

.manaN{font-family:var(--display);font-size:13px;color:var(--gold);min-width:2ch;text-align:right}

    function online(){
      db.goOnline();
      if(!watching){ watching=true; db.ref('.info/connected').on('value',s=>{ conn.v=!!s.val(); for(const h of conn.hs){ try{h(conn.v);}catch(e){} } }); }
    }
    async function join(name){
      if(!/^tc-[a-z0-9]{4}$/.test(name)) throw {code:'invalid_argument',message:'room name'};
      if(rooms.has(name)) return rooms.get(name);
      const user=await signIn();
      online();
      const myId=user.uid+'-'+TAB, base=db.ref('rooms/'+name+'/p'), me=base.child(myId);
      const others=new Map(), hs=new Set(), errs=new Set();
      let my={}, left=false, snap=null, queued=false;
      function build(){
        const arr=[{peer:myId,by:null,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:Object.freeze({...my}),updatedAt:performance.now()}];
        for(const [k,v] of others) arr.push({peer:k,by:null,isMe:k.startsWith(user.uid+'-'),sameTab:false,kind:'viewer',guest:false,presence:v.p,updatedAt:v.t});
        return (snap=Object.freeze(arr));
      }
      build();
      function notify(){ build(); if(queued) return; queued=true; setTimeout(()=>{ queued=false; if(left) return; const s=build(); for(const h of hs){ try{h({peers:s,joined:[],left:[],updated:[]});}catch(e){console.error(e);} } },0); }
      const onSet=s=>{ if(s.key===myId) return; others.set(s.key,{p:Object.freeze(s.val()||{}),t:performance.now()}); notify(); };
      const onRem=s=>{ if(others.delete(s.key)) notify(); };
      const onErr=e=>{ for(const f of errs){ try{f({code:'not_permitted',message:String((e&&e.message)||e)});}catch(_){} } };
      base.on('child_added',onSet,onErr); base.on('child_changed',onSet,onErr); base.on('child_removed',onRem,onErr);
      await me.onDisconnect().remove();
      const api={
        name,
        presence(patch){
          if(left) return Promise.reject({code:'invalid_argument',message:'left'});
          const up={}; for(const k in patch){ const v=patch[k]; if(v===null||v===undefined){ delete my[k]; up[k]=null; } else { my[k]=v; up[k]=v; } }
          notify(); return me.update(up).catch(e=>{ throw {code:'upstream_error',message:String((e&&e.message)||e)}; });
        },
        peers(){ return snap; },
        onPeers(h,onError){ hs.add(h); if(onError) errs.add(onError); setTimeout(()=>{ if(hs.has(h)) h({peers:build(),joined:snap,left:[],updated:[]}); },0); return ()=>{ hs.delete(h); if(onError) errs.delete(onError); }; },
        emit(){ return Promise.resolve(); }, on(){ return ()=>{}; },
        connected(){ return conn.v; },
        onConnection(h){ conn.hs.add(h); setTimeout(()=>h(conn.v),0); return ()=>conn.hs.delete(h); },
        leave(){
          if(left) return Promise.resolve(); left=true; rooms.delete(name);
          base.off('child_added',onSet); base.off('child_changed',onSet); base.off('child_removed',onRem); hs.clear(); errs.clear();
          // remove() is sent first; the onDisconnect() removal stays armed in case the page closes before it lands
          return me.remove().catch(()=>{}).then(()=>{ if(!rooms.size) db.goOffline(); });
        }
      };
      rooms.set(name,api);
      return api;
    }
    window.addEventListener('pagehide',()=>{ for(const r of [...rooms.values()]) r.leave(); });
    return Promise.resolve({join});
  };
})();
</script>

<script>
(() => {
'use strict';
const TEST=window.__TC_TEST||null;
const N=10, CELL=32, TPS=20, TICK=1/TPS;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');

const TOWERS={
  arrow :{name:'화살탑', cost:3, hp:120, range:2.6, dmg:14, cd:0.9, desc:'가장 가까운 적 병사를 빠르게 쏜다. 기본 방어 타워, 어디에나 무난하다.'},
  cannon:{name:'대포',   cost:5, hp:140, range:2.2, dmg:30, cd:2.9, splash:1.0, desc:'포탄이 떨어진 자리 1칸 범위를 함께 때린다. 뭉쳐 오는 병사에 강하고, 빠른 척후에는 자주 빗나간다.'},
  frost :{name:'서리탑', cost:4, hp:110, range:2.2, dmg:4,  cd:1.45, slow:0.4, desc:'범위 안 적 병사를 40% 느리게 만들고 조금씩 피해를 준다. 둔화는 중첩되지 않는다. 대포 옆에 두면 좋다.'},
  banner:{name:'깃발',   cost:4, hp:90,  range:0, max:1, rally:true, desc:'아군 병사가 이 깃발을 먼저 거친 뒤 여기서부터 적 킹으로 진격한다. 적 방어가 약한 쪽으로 길을 틀 때 쓴다. 한 번에 1개.'},
  wall  :{name:'성벽',   cost:1, hp:150, range:0, max:3, desc:'공격하지 않는 길막기용. 병사는 성벽을 부수며 전진하므로 시간을 번다. 한 번에 3개까지.'},
  shrine:{name:'신전',   cost:4, hp:100, range:2.0, heal:6, cd:1.0, desc:'범위 안 아군 병사를 초당 6 회복한다. 거한과 궁합이 좋다.'},
};
const TKEYS=Object.keys(TOWERS);
const SOLDIERS={
  footman:{name:'보병', hp:70,  dmg:8,  spd:0.55, cd:1.45, desc:'기본 병사. 체력·속도·공격이 모두 보통이다.'},
  scout  :{name:'척후', hp:40,  dmg:6,  spd:1.0,  cd:1.1, desc:'빠르지만 약하다. 대포를 피해 먼저 도착해 타워를 흔든다.'},
  brute  :{name:'거한', hp:170, dmg:16, spd:0.33, cd:2.2, desc:'느리고 단단하다. 화살을 받아내며 길을 연다.'},
  siege  :{name:'공성차', hp:110, dmg:6, spd:0.4, cd:1.8, siege:true, structMul:5, desc:'적 병사를 무시하고 전진해 타워와 킹에만 5배 피해(30)를 준다. 병사에게는 반격하지 못한다.'},
};
const UKEYS=Object.keys(SOLDIERS);
const KING_HP=1000, MANA_MAX=10, MANA_REGEN=0.2, WAVE_T=14, PREP_T=10, BOOST_T=180;
// no time limit: every BOOST_T seconds mana regenerates one step faster (x2 at 3:00, x3 at 6:00, ...);
// with SOLDIER_BOOST the soldiers that spawn from then on get the same multiplier on HP and attack, so games still end
const SOLDIER_BOOST=true;
const boostAt=tick=>1+Math.floor(tick/(BOOST_T*TPS));
const lvlMul=l=>1+0.5*(l-1);
// sqrt is exactly rounded in every engine (Math.hypot is not), so the simulation stays identical on both players' devices
const hyp=(x,y)=>Math.sqrt(x*x+y*y);

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---- mode / sides ----
// The simulation always has side 'you' at the bottom rows and 'foe' at the top rows.
// ME is the side this screen controls; the friend-match guest plays 'foe' and sees the board turned 180°.
let MODE='ai', ME='you', OPP='foe', FLIP=false, AI_SIDE='foe';
const other=s=>s==='you'?'foe':'you';

let S;
function newSeed(){ return ((Date.now()^Math.floor(Math.random()*4294967296))>>>0)||1; }
function newState(seed){
  seed=(seed==null?newSeed():seed)>>>0;
  return {
    tick:0, t:0, acc:0, running:false, over:false, boost:1, result:null, seed, rng:mulberry32(seed),
    kings:{you:{hp:KING_HP,cell:[9,4],cd:0}, foe:{hp:KING_HP,cell:[0,4],cd:0}},
    mana:{you:5, foe:5},
    towers:[], soldiers:[],
    waveTimer:PREP_T, wave:0, aiTimer:2,
    reinforce:{you:null, foe:null},
    sel:null, hover:null, menuTower:null, dist:{you:null,foe:null}, rally:{you:null,foe:null},
  };
}
const kingCell=(side,r,c)=>S.kings[side].cell[0]===r&&S.kings[side].cell[1]===c;
const towerAt=(r,c)=>S.towers.find(t=>t.r===r&&t.c===c&&t.hp>0);
const blocked=(r,c)=>kingCell('you',r,c)||kingCell('foe',r,c)||!!towerAt(r,c);
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];

// open cells next to (r0,c0); `extra` is a cell treated as blocked (a tower about to be placed)
function seedsAround(r0,c0,extra){
  const out=[];
  for(const [dr,dc] of DIRS){const r=r0+dr,c=c0+dc; if(r<0||c<0||r>=N||c>=N) continue;
    if(blocked(r,c)||(extra&&extra[0]===r&&extra[1]===c)) continue; out.push([r,c]);}
  return out;
}
// steps to reach the seed cells (seeds = 1)
function bfs(seeds, extra){
  const d=Array.from({length:N},()=>Array(N).fill(Infinity)), q=[];
  for(const [r,c] of seeds){ d[r][c]=1; q.push([r,c]); }
  while(q.length){const [r,c]=q.shift();
    for(const [dr,dc] of DIRS){const nr=r+dr,nc=c+dc; if(nr<0||nc<0||nr>=N||nc>=N) continue;
      if(blocked(nr,nc)||(extra&&extra[0]===nr&&extra[1]===nc)) continue;
      if(d[nr][nc]>d[r][c]+1){d[nr][nc]=d[r][c]+1;q.push([nr,nc]);}}}
  return d;
}
function computeDist(target, extra){ const [kr,kc]=S.kings[target].cell; return bfs(seedsAround(kr,kc,extra),extra); }
// a side's flag is a rally point: its soldiers walk to the flag first, then on to the enemy king
const flagOf=side=>S.towers.find(t=>t.side===side&&t.type==='banner'&&t.hp>0)||null;
function refreshDist(){
  S.dist.you=computeDist('foe'); S.dist.foe=computeDist('you');
  for(const side of ['you','foe']){ const f=flagOf(side); S.rally[side]=f?bfs(seedsAround(f.r,f.c)):null; }
}
function kingReachable(side,d){const [kr,kc]=S.kings[side].cell;return DIRS.some(([dr,dc])=>{const a=kr+dr,b=kc+dc;return a>=0&&b>=0&&a<N&&b<N&&d[a][b]<Infinity;});}
function spawnCells(side){
  const out=[], [kr,kc]=S.kings[side].cell;
  for(const [dr,dc] of DIRS){const r=kr+dr,c=kc+dc; if(r<0||c<0||r>=N||c>=N) continue;
    if(!blocked(r,c)&&S.dist[side][r][c]<Infinity) out.push([r,c]);}
  return out;
}
function ownHalf(side,r){return side==='you'?r>=5:r<=4;}
function nearOwnSoldier(side,r,c){return S.soldiers.some(s=>s.side===side&&s.hp>0&&Math.abs(Math.round(s.y)-r)<=1&&Math.abs(Math.round(s.x)-c)<=1);}
function canPlace(side,r,c,type){
  if(r<0||c<0||r>=N||c>=N||blocked(r,c)) return {ok:false,why:'빈 칸이 아닙니다'};
  if(S.soldiers.some(s=>s.hp>0&&Math.round(s.y)===r&&Math.round(s.x)===c)) return {ok:false,why:'병사가 서 있습니다'};
  if(!ownHalf(side,r)&&!nearOwnSoldier(side,r,c)) return {ok:false,why:'내 진영 또는 아군 병사 주변 1칸만'};
  const def=TOWERS[type];
  if(def.max&&S.towers.filter(t=>t.side===side&&t.type===type&&t.hp>0).length>=def.max) return {ok:false,why:`${def.name}은 ${def.max}개까지`};
  const dY=computeDist('foe',[r,c]), dF=computeDist('you',[r,c]);
  if(!kingReachable('you',dY)||!kingReachable('foe',dF)) return {ok:false,why:'길이 완전히 막힙니다'};
  return {ok:true};
}
function previewState(side,type,r,c,mana){ // what a drop here would do
  if(mana==null) mana=S.mana[side];
  const t=towerAt(r,c);
  if(t){ if(t.side===side&&t.type===type){ if(t.lvl>=3) return {ok:false,why:'최대 레벨입니다',mode:'up'}; if(mana<TOWERS[type].cost) return {ok:false,why:'마나 부족',mode:'up'}; return {ok:true,mode:'up'}; }
    return {ok:false,why:t.side===side?'다른 타워가 있습니다':'적 타워입니다',mode:'place'}; }
  if(mana<TOWERS[type].cost) return {ok:false,why:'마나 부족',mode:'place'};
  const chk=canPlace(side,r,c,type); return {ok:chk.ok,why:chk.why,mode:'place'};
}
function place(side,type,r,c){
  const def=TOWERS[type], pv=previewState(side,type,r,c);
  if(!pv.ok){ if(side===ME){toast(MODE==='pvp'?`설치 실패: ${pv.why}`:pv.why);sfx('error');} return false; }
  if(pv.mode==='up'){ return upgrade(side,towerAt(r,c)); }
  S.mana[side]-=def.cost;
  S.towers.push({side,type,r,c,lvl:1,hp:def.hp,maxhp:def.hp,cd:0,built:S.t,hitAt:-9});
  vfxBuild(c,r); refreshDist();
  // a new flag also reroutes the soldiers still behind it; the ones already past its row keep going
  if(def.rally) for(const s of S.soldiers) if(s.side===side&&s.hp>0) s.via=side==='you'?Math.round(s.y)>r:Math.round(s.y)<r;
  if(side===ME&&MODE!=='pvp') sfx('place'); return true;
}
function upgrade(side,t){
  const def=TOWERS[t.type]; if(t.lvl>=3||S.mana[side]<def.cost) return false;
  S.mana[side]-=def.cost; t.lvl++;
  const ratio=t.hp/t.maxhp; t.maxhp=Math.round(def.hp*lvlMul(t.lvl)); t.hp=Math.min(t.maxhp,Math.round(t.maxhp*ratio)+def.hp*0.5);
  t.built=S.t; if(side===ME&&MODE!=='pvp') sfx('place'); return true;
}
const refundOf=t=>TOWERS[t.type].cost*t.lvl*0.25;
const fmtNum=v=>v.toFixed(2).replace(/\.?0+$/,'');
function sellTower(side,t){
  S.mana[side]=Math.min(MANA_MAX,S.mana[side]+refundOf(t)); t.hp=0; S.towers=S.towers.filter(x=>x.hp>0); refreshDist(); vfxPoof(t.c,t.r);
  if(S.menuTower===t) closeMenu();
  if(side===ME){ sfx('sell'); toast(`${TOWERS[t.type].name} 판매 +${fmtNum(refundOf(t))}`); }
}

function spawnWave(){
  S.wave++;
  const base=2+Math.floor(S.wave/3);
  for(const side of ['you','foe']){
    const cells=spawnCells(side); if(!cells.length) continue;
    const list=[];
    for(let i=0;i<base;i++){const roll=S.rng(); list.push(roll<0.15?'siege': roll<0.35?'brute': roll<0.6?'scout':'footman');}
    if(side===AI_SIDE&&!S.reinforce[side]){const r=S.rng(); S.reinforce[side]= r<0.35?'footman': r<0.6?'scout': r<0.8?'brute':'siege';}
    if(S.reinforce[side]) list.push(S.reinforce[side]);
    const via=!!flagOf(side), pw=SOLDIER_BOOST?S.boost:1;
    for(const type of list){
      const [r,c]=cells[Math.floor(S.rng()*cells.length)]; const def=SOLDIERS[type];
      const x=c+(S.rng()-.5)*.3, y=r+(S.rng()-.5)*.3;
      S.soldiers.push({side,type,pw,x,y,px:x,py:y,hp:def.hp*pw,maxhp:def.hp*pw,cd:S.rng()*def.cd,slow:0,buff:0,buffAmt:0,moving:false,ph:Math.floor(S.rng()*2),hitAt:-9,via});
    }
    if(side===AI_SIDE) S.reinforce[side]=null;
  }
  sfx('wave');
}
const dist=(a,b)=>hyp(a.x-b.x,a.y-b.y);
function damage(obj,amt,bySide){obj.hp-=amt;obj.hitAt=S.t;hit(obj.x??obj.c,obj.y??obj.r,bySide);}

function updateSoldier(s,dt){
  const def=SOLDIERS[s.type], enemy=other(s.side);
  const spdMul=(s.slow>0?0.6:1)*(1+(s.buff>0?s.buffAmt:0)), dmgMul=(1+(s.buff>0?s.buffAmt:0))*s.pw;
  s.cd-=dt; s.moving=false;
  const structMul=def.structMul||1;
  let target=null, best=0.75;
  if(!def.siege) for(const e of S.soldiers){ if(e.side===enemy&&e.hp>0){const d=dist(s,e); if(d<best){best=d;target=e;}}}
  if(target){ if(s.cd<=0){damage(target,def.dmg*dmgMul,enemy);s.cd=def.cd;sfx('hit'); if(target.hp<=0) sfx('death');} return; }
  const r=Math.round(s.y), c=Math.round(s.x), [kr,kc]=S.kings[enemy].cell;
  if(Math.abs(kr-r)+Math.abs(kc-c)===1 && hyp(kr-s.y,kc-s.x)<1.15){
    if(s.cd<=0){const dmg=def.dmg*dmgMul*structMul; S.kings[enemy].hp-=dmg; S.kings[enemy].hitAt=S.t; s.cd=def.cd; hit(kc,kr,enemy); vfxNum(kc,kr,dmg,enemy); sfx('kinghit'); if(enemy===ME) kingFlash();} return; }
  let d=S.dist[s.side];
  if(s.via){ const f=flagOf(s.side), rd=S.rally[s.side];
    if(!f||!rd||!(rd[r]?.[c]<Infinity)) s.via=false;   // no flag, or it cannot be reached from here
    else if(Math.abs(f.r-r)+Math.abs(f.c-c)===1&&hyp(f.r-s.y,f.c-s.x)<1.15) s.via=false;   // reached the flag
    else d=rd; }
  let nr=r,nc=c,bd=d[r]?.[c]??Infinity;
  for(const [dr,dc] of DIRS){const a=r+dr,b=c+dc; if(a<0||b<0||a>=N||b>=N) continue; if(d[a][b]<bd){bd=d[a][b];nr=a;nc=b;}}
  const noPath=!(bd<Infinity);
  let tw=null;
  for(const [dr,dc] of DIRS){const t=towerAt(r+dr,c+dc); if(t&&t.side===enemy){ if(noPath||def.siege||t.type==='wall'||S.rng()<0.02){tw=t;break;} }}
  if(tw&&hyp(tw.r-s.y,tw.c-s.x)<1.2){ if(s.cd<=0){damage(tw,def.dmg*dmgMul*structMul,enemy);s.cd=def.cd;sfx('hit'); if(tw.hp<=0){vfxRubble(tw);S.towers=S.towers.filter(x=>x.hp>0);refreshDist();sfx('death');}} return; }
  if(noPath){ const dir=s.side==='you'?-1:1; s.y+=dir*def.spd*spdMul*dt*0.3; s.moving=true; return; }
  const dx=nc-s.x, dy=nr-s.y, L=hyp(dx,dy), step=def.spd*spdMul*dt;
  s.moving=true; if(L<=step){s.x=nc;s.y=nr;} else {s.x+=dx/L*step;s.y+=dy/L*step;}
  for(const o of S.soldiers){ if(o!==s&&o.hp>0&&o.side===s.side){const dd=dist(s,o); if(dd<0.35&&dd>0){const k=Math.min(0.02,dt*0.5);s.x+=(s.x-o.x)/dd*k;s.y+=(s.y-o.y)/dd*k;}}}
}
function updateTower(t,dt){
  const def=TOWERS[t.type], m=lvlMul(t.lvl), range=def.range+0.25*(t.lvl-1), p={x:t.c,y:t.r}, enemy=other(t.side);
  t.cd-=dt;
  if(S.t-t.built<0.3) return; // under construction
  if(def.buff){ const amt=def.buff+0.1*(t.lvl-1); for(const s of S.soldiers) if(s.side===t.side&&s.hp>0&&dist(p,s)<=range){s.buff=1;s.buffAmt=Math.max(s.buffAmt,amt);} return; }
  if(def.heal){ if(t.cd<=0){t.cd=def.cd; for(const s of S.soldiers) if(s.side===t.side&&s.hp>0&&s.hp<s.maxhp&&dist(p,s)<=range){s.hp=Math.min(s.maxhp,s.hp+def.heal*m);vfxHeal(s.x,s.y);}} return; }
  if(def.slow){ if(t.cd<=0){t.cd=def.cd; let any=false; for(const s of S.soldiers) if(s.side===enemy&&s.hp>0&&dist(p,s)<=range){s.slow=1;s.hp-=def.dmg*m;any=true;vfxIce(s.x,s.y);} if(any) vfxFrost(p.x,p.y,range);} return; }
  if(!def.dmg||t.cd>0) return;
  let target=null,best=Infinity;
  for(const s of S.soldiers) if(s.side===enemy&&s.hp>0){const d=dist(p,s); if(d<=range&&d<best){best=d;target=s;}}
  if(!target) return;
  t.cd=def.cd;
  vfxShot(def.splash?'ball':'arrow',t.side,p.x,p.y,target.x,target.y,def.splash||0);
  if(def.splash){ for(const s of S.soldiers) if(s.side===enemy&&s.hp>0&&dist(target,s)<=def.splash){s.hp-=def.dmg*m;s.hitAt=S.t;} sfx('fire'); }
  else { target.hp-=def.dmg*m; target.hitAt=S.t; }
}
function hit(x,y,side){vfxHit(x,y,side);}

// ---- AI (plays either side; row lists are written for the top side and mirrored for the bottom) ----
function aiThink(side){
  const opp=other(side), m=S.mana[side], rng=S.rng, R=r=>side==='foe'?r:N-1-r;
  const threats=S.soldiers.filter(s=>s.side===opp&&s.hp>0);
  const mine=S.towers.filter(t=>t.side===side);
  const counts=k=>mine.filter(t=>t.type===k).length;
  const oppGuns=S.towers.filter(t=>t.side===opp&&TOWERS[t.type].dmg);
  let choice=null;
  if(threats.length>=3&&m>=5&&counts('cannon')<3) choice='cannon';
  else if(m>=4&&counts('frost')<2&&S.wave>=2) choice='frost';
  else if(m>=3&&counts('arrow')<4) choice='arrow';
  else if(m>=4&&counts('banner')<1&&S.wave>=1&&oppGuns.length>=2) choice='banner';
  else if(m>=4&&counts('shrine')<1&&S.wave>=3) choice='shrine';
  else if(m>=1&&rng()<0.4&&counts('wall')<3) choice='wall';
  else if(m>=3&&rng()<0.35){ const ups=mine.filter(t=>(t.type==='arrow'||t.type==='cannon')&&t.lvl<3&&TOWERS[t.type].cost<=m); if(ups.length){upgrade(side,ups[Math.floor(rng()*ups.length)]);return;} }
  else if(m>=9) choice=rng()<0.5?'arrow':'cannon';
  if(!choice) return;
  const cand=[];
  const rows=(choice==='wall'||choice==='banner'?[3,4]: choice==='shrine'?[1,2]:[1,2,3,4]).map(R);
  const seen=new Set();
  const push=(r,c)=>{const k=r*N+c; if(seen.has(k)||r<0||c<0||r>=N||c>=N||blocked(r,c)) return; seen.add(k);
    let score=rng();
    if(choice==='arrow'||choice==='cannon'||choice==='frost'){ for(const s of threats) score+=Math.max(0,3-hyp(s.x-c,s.y-r))*0.5; score+=(c>=2&&c<=7)?0.8:0; score-=Math.abs(c-4.5)*0.1; }
    if(choice==='wall'){ score+=S.dist[opp][r][c]<Infinity?1:0; score+=(c>=3&&c<=6)?0.6:0; }
    if(choice==='shrine'){ score+=(c>=3&&c<=6)?1:0; }
    // the flag goes in front of our half, on the column the opponent's guns cover least
    if(choice==='banner'){ let cover=0; for(const t of oppGuns) cover+=Math.max(0,3-Math.abs(t.c-c)); score=score*0.3-cover*0.6-Math.abs(c-4.5)*0.05; }
    cand.push({r,c,score});};
  for(const r of rows) for(let c=0;c<N;c++) push(r,c);
  if(choice==='arrow'||choice==='cannon'||choice==='frost') for(const s of S.soldiers) if(s.side===side&&s.hp>0){const r0=Math.round(s.y),c0=Math.round(s.x); for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) push(r0+dr,c0+dc);}
  cand.sort((a,b)=>b.score-a.score);
  for(const k of cand.slice(0,8)){ if(place(side,choice,k.r,k.c)) return; }
}

// ---- simulation step (fixed 20Hz) ----
function winnerByHp(){ const a=S.kings.you.hp, b=S.kings.foe.hp; return a>b?'you':a<b?'foe':null; }
function step(dt){
  S.tick++; S.t=S.tick*TICK;
  if(TEST&&TEST.endAt&&S.tick===TEST.endAt){ endGame(winnerByHp()); return; }
  const boost=boostAt(S.tick); if(boost!==S.boost){ S.boost=boost; toast(SOLDIER_BOOST?`마나 재생·병사 능력치 x${boost}`:`마나 재생 x${boost}`); sfx('wave'); }
  for(const side of ['you','foe']) S.mana[side]=Math.min(MANA_MAX,S.mana[side]+MANA_REGEN*S.boost*dt);
  S.waveTimer-=dt; if(S.waveTimer<=0){S.waveTimer=WAVE_T;spawnWave();}
  if(AI_SIDE){ S.aiTimer-=dt; if(S.aiTimer<=0){S.aiTimer=1.5+S.rng()*1.5;aiThink(AI_SIDE);} }
  for(const s of S.soldiers){s.px=s.x;s.py=s.y;s.slow=Math.max(0,s.slow-dt*0.8);s.buff=Math.max(0,s.buff-dt*1.1); if(s.buff<=0) s.buffAmt=0;}
  for(const t of S.towers) updateTower(t,dt);
  for(const s of S.soldiers) if(s.hp>0) updateSoldier(s,dt);
  for(const side of ['you','foe']){const k=S.kings[side]; k.cd-=dt; if(k.cd<=0){const kp={x:k.cell[1],y:k.cell[0]}; let tg=null,b=2.3; for(const s of S.soldiers) if(s.side===other(side)&&s.hp>0){const d=dist(kp,s); if(d<b){b=d;tg=s;}} if(tg){tg.hp-=10;tg.hitAt=S.t;k.cd=1.6;vfxShot('arrow',side,kp.x,kp.y,tg.x,tg.y,0);}}}
  const deadS=S.soldiers.some(s=>s.hp<=0); if(deadS){ sfx('death'); for(const s of S.soldiers) if(s.hp<=0) vfxDeath(s); S.soldiers=S.soldiers.filter(s=>s.hp>0); }
  if(S.towers.some(t=>t.hp<=0)){ if(S.menuTower&&S.menuTower.hp<=0) closeMenu(); for(const t of S.towers) if(t.hp<=0) vfxRubble(t); S.towers=S.towers.filter(t=>t.hp>0);refreshDist(); }
  const youDown=S.kings.you.hp<=0, foeDown=S.kings.foe.hp<=0;
  if(youDown||foeDown) endGame(youDown&&foeDown?null:foeDown?'you':'foe');
}
function endGame(winner){
  S.over=true; S.running=false; closeMenu(); S.sel=null; S.hover=null;
  S.result=winner===null?'draw':winner===ME?'win':'lose';
  S.byKo=S.kings.you.hp<=0||S.kings.foe.hp<=0;
  sfx(S.result==='win'?'win':'lose');
  if(MODE==='pvp'&&NET){ NET.state='over'; NET.myRm=0; NET.oppRm=0; }
  showOver();
}
function stateHash(){
  let h=2166136261>>>0; const mix=v=>{h=Math.imul(h^(v|0),16777619)>>>0;};
  mix(S.tick); mix(Math.round(S.kings.you.hp*1000)); mix(Math.round(S.kings.foe.hp*1000)); mix(Math.round(S.mana.you*1e6)); mix(Math.round(S.mana.foe*1e6));
  for(const t of S.towers){ mix(t.r*16+t.c); mix(TKEYS.indexOf(t.type)); mix(t.lvl); mix(Math.round(t.hp*1000)); mix(t.side==='you'?1:2); }
  mix(S.soldiers.length);
  for(const s of S.soldiers){ mix(Math.round(s.x*1e6)); mix(Math.round(s.y*1e6)); mix(Math.round(s.hp*1000)); mix(s.via?1:0); }
  return h;
}

const sprCache=new Map();

// the route my soldiers take through a flag (spawn -> flag -> enemy king), with the simulation's next-cell rule
function walkField(d,r,c){ const out=[[r,c]];
  for(let i=0;i<N*N;i++){ let nr=r,nc=c,bd=d[r][c]; for(const [dr,dc] of DIRS){const a=r+dr,b=c+dc; if(a<0||b<0||a>=N||b>=N) continue; if(d[a][b]<bd){bd=d[a][b];nr=a;nc=b;}}
    if(nr===r&&nc===c) break; r=nr;c=nc; out.push([r,c]); }
  return out; }
function flagRoute(side,fr,fc,planned){
  const extra=planned?[fr,fc]:null;
  const kd=planned?computeDist(other(side),extra):S.dist[side], rd=planned?bfs(seedsAround(fr,fc,extra),extra):S.rally[side];
  if(!kd||!rd) return null;
  const [kr,kc]=S.kings[side].cell; let st=null;
  for(const [r,c] of seedsAround(kr,kc,extra)) if(rd[r][c]<Infinity&&(!st||rd[r][c]<rd[st[0]][st[1]])) st=[r,c];
  if(!st) return null;
  const a=walkField(rd,st[0],st[1]), e=a[a.length-1];
  return a.concat(walkField(kd,e[0],e[1]).slice(1));
}
function drawRoute(cells){
  if(!cells||cells.length<2) return;
  const off=Math.floor(performance.now()/90)%6; let ph=0;
  ctx.fillStyle=PAL.gold; ctx.globalAlpha=0.9;
  for(let i=1;i<cells.length;i++){ const [r0,c0]=cells[i-1],[r1,c1]=cells[i], x0=LX(c0),y0=LY(r0),x1=LX(c1),y1=LY(r1);
    for(let k=((off-ph)%6+6)%6;k<CELL;k+=6) ctx.fillRect(Math.round(x0+(x1-x0)*k/CELL)-1,Math.round(y0+(y1-y0)*k/CELL)-1,2,2);
    ph+=CELL; }
  ctx.globalAlpha=1;
}

function vfxShot(kind,side,x0,y0,x1,y1,splash){

}

function vfxUpdate(dt){
  for(let i=VFX.length-1;i>=0;i--){ const e=VFX[i]; e.t+=dt;
    if(e.k==='p'){ e.x+=e.vx*dt; e.y+=e.vy*dt; e.vy+=e.g*dt; }
    else if(e.k==='smoke'){ e.y+=e.vy*dt; }
    if(e.t>=e.life){
      if(e.k==='arrow') vfxAdd({k:'spark',layer:'air',x:e.ex,y:e.ey-2,t:0,life:0.1,small:true});
      else if(e.k==='ball') explode(e.ex,e.ey,e.r);
      VFX.splice(i,1);
    }
  }
}
function pixDisc(cx,cy,r){ cx=Math.round(cx); cy=Math.round(cy); for(let dy=-r;dy<=r;dy++){ const w=Math.floor(Math.sqrt(r*r-dy*dy)); ctx.fillRect(cx-w,cy+dy,2*w+1,1); } }

function onPeersChange(){

function issue(op,a,b=0,c=0){
  if(MODE!=='pvp'||!NET||NET.state!=='play'||S.over) return null;
  const T=S.tick+NET.D, cmd=[++NET.seq,T,op,a,b,c];

}
function queueCmd(side,cmd){

  let e=NET.q.get(T); if(!e){ e={you:[],foe:[]}; NET.q.set(T,e); } e[side].push(cmd);
}
function execCmd(side,cmd){
  const op=cmd[2], a=cmd[3], b=cmd[4], c=cmd[5], inB=(r,q)=>r>=0&&q>=0&&r<N&&q<N;
  if(op===1){ const type=TKEYS[a]; if(type&&inB(b,c)) place(side,type,b,c); }
  else if(op===2){ if(inB(a,b)){ const t=towerAt(a,b); if(t&&t.side===side) upgrade(side,t); } }
  else if(op===3){ if(inB(a,b)){ const t=towerAt(a,b); if(t&&t.side===side) sellTower(side,t); } }
  else if(op===4){ S.reinforce[side]=a>=0&&UKEYS[a]?UKEYS[a]:null; }
}
function applyQueued(T){

  }
  if(!gap&&Number.isInteger(pr.f)&&pr.f>NET.peerF) NET.peerF=pr.f;
  if(Number.isInteger(pr.a)&&pr.a>NET.oppAckOfMine){ NET.oppAckOfMine=pr.a; NET.dirty=true; }

}

    r.innerHTML='<p><b>승리</b> 상대 킹(HP 1000)을 부수면 승리. 시간 제한은 없다.</p><p><b>가속</b> 3분마다 마나 재생이 빨라진다(3분 x2, 6분 x3 …).'+(SOLDIER_BOOST?' 그때부터 나오는 병사의 체력·공격도 같은 배수로 오른다.':'')+'</p><p><b>마나</b> 최대 10, 초당 0.2 회복. 시작 마나 5.</p><p><b>설치</b> 내 진영 5줄과 아군 병사 주변 1칸의 빈 칸. 양쪽 킹 사이 길이 완전히 막히는 자리는 설치 불가.</p><p><b>강화</b> 같은 타워를 같은 칸에 다시 놓거나 타워 메뉴에서 강화. 최대 3레벨, 비용은 설치 비용과 같다.</p><p><b>판매</b> 쓴 마나의 25%를 돌려받는다.</p><p><b>친구 대전</b> 방을 만들어 4자리 코드를 알려 주면 친구가 같은 페이지에서 입장한다. 내 조작은 0.4초 뒤에 양쪽 화면에 함께 반영되고, 일시정지는 없다. 각자 화면에서는 자기 킹이 아래에 보인다.</p><p><b>조작</b> 카드 드래그 또는 카드 탭 → 칸 탭. 내 타워를 누르면 강화·판매 메뉴. 키보드 1~6 선택, 스페이스 일시정지.</p>';
    cxBody.appendChild(r);
  }
}
function codexOpen(){cxWasRunning=S.running; if(MODE!=='pvp') S.running=false; cxRender();codexEl.hidden=false;$('cxClose').focus();}
function codexClose(){codexEl.hidden=true; if(MODE!=='pvp'&&cxWasRunning&&!S.over&&$('overlay').hidden) S.running=true; cxWasRunning=false;}
$('infoBtn').addEventListener('click',()=>{ if(codexEl.hidden) codexOpen(); else codexClose(); });
$('cxClose').addEventListener('click',codexClose);
codexEl.addEventListener('click',e=>{ if(e.target===codexEl) codexClose(); });
for(const b of document.querySelectorAll('.cx-tab')) b.addEventListener('click',()=>{cxTab=b.dataset.tab;cxRender();});

// ---- sizing: integer pixel scale ----
function resize(){
  const wrap=$('boardwrap'); const avail=Math.max(320,Math.min(wrap.clientWidth-12-4,672)); const dpr=window.devicePixelRatio||1;
  const k=Math.max(1,Math.floor(avail*dpr/(N*CELL)));
  SCALE=k; cv.width=N*CELL*k; cv.height=N*CELL*k; const cssW=N*CELL*k/dpr; cv.style.width=cssW+'px'; cv.style.height=cssW+'px';
}
new ResizeObserver(resize).observe($('boardwrap')); resize();

// ---- loop ----
let last=performance.now();
function frame(now){ let dt=(now-last)/1000; last=now; if(dt>0.25) dt=0.25;
  if(S.running&&!S.over){
    S.acc+=dt; let n=0;
    while(S.acc>=TICK&&n<8&&!S.over&&S.running){
      if(MODE==='pvp'){
        if(!NET||NET.state!=='play'||S.tick+1>NET.peerF){ if(NET&&!NET.stallSince) NET.stallSince=now; S.acc=Math.min(S.acc,TICK); break; }
        if(NET.stallSince) NET.stallSince=0;
        applyQueued(S.tick+1);
      }
      step(TICK); S.acc-=TICK; n++;
      if(MODE==='pvp'&&NET&&NET.state==='play') afterTick();
    }
  }
  netWatch(now); netPump(now);
  draw(); requestAnimationFrame(frame); }
showMenu();

if(TEST) window.__TC={ get S(){return S;}, get NET(){return NET;}, get MODE(){return MODE;}, get ME(){return ME;}, hash:()=>stateHash(),
  doPlace, doRf, doSell:(r,c)=>{const t=towerAt(r,c); if(t&&t.side===ME) doSell(t);}, doUpgrade:(r,c)=>{const t=towerAt(r,c); if(t&&t.side===ME) doUpgrade(t);},
  ownCells:()=>{ const out=[]; for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(ownHalf(ME,r)&&!blocked(r,c)) out.push([r,c]); return out; }, vfxCount:()=>VFX.length };
requestAnimationFrame(frame);
})();
