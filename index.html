.frame.x2{border-width:12px;border-image-width:12px}
.lbl{font-family:var(--display);font-size:8px;letter-spacing:0;text-transform:uppercase;color:var(--muted)}
.lbl.foe{color:var(--foe-hi)} .lbl.you{color:var(--you-hi)}
.num{font-family:var(--display);color:var(--fg);font-size:8px}
.bar{height:12px;border:2px solid var(--fg);background:#0c0a0c;position:relative;overflow:hidden}
.bar i{display:block;height:100%;transition:width .15s}
.bar.foe i{background:var(--foe)} .bar.you i{background:var(--you)}
.bar::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(0,0,0,.5) calc(10% - 2px) 10%);pointer-events:none}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:4px 6px}
.side{display:flex;align-items:center;gap:8px;min-width:0}
.portrait{width:28px;height:28px;image-rendering:pixelated;flex:none;display:block}
.bars{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.timer{font-family:var(--display);font-size:16px;text-align:center;line-height:1.3;color:var(--fg-hi)}
.timer small{display:block;font-size:7px;color:var(--muted);letter-spacing:.05em;min-height:9px;text-shadow:none}
.timer.sd{color:var(--foe-hi)} .timer.sd small{color:var(--foe-hi)}
.ctrls{display:flex;justify-content:flex-end;gap:5px}
.ib{font-family:var(--display);font-size:8px;border:2px solid var(--fg);background:var(--panel);color:var(--fg);padding:0 6px;cursor:pointer;min-width:36px;min-height:34px}
.ib:hover{background:#1c1922}

.bottom{display:flex;flex-direction:column;gap:8px}
.mana{display:flex;align-items:center;gap:8px;padding:4px 8px}
.segs{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.seg{height:14px;border:2px solid var(--muted);background:#0c0a0c;position:relative;overflow:hidden}

.seg.on{border-color:var(--fg)}
.manaN{font-family:var(--display);font-size:13px;color:var(--gold);min-width:2ch;text-align:right}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}

.card.poor{opacity:.45}
.card.poor .cc{color:var(--foe-hi)}
.wave{display:flex;flex-direction:column;gap:6px;padding:6px 8px}
.wave .wl{font-size:12px;color:var(--muted);min-width:0;font-variant-numeric:tabular-nums;font-weight:500}
.rbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btn,.rb{font-family:var(--body);font-weight:600;color:var(--fg);background:var(--panel);border:2px solid var(--fg);cursor:pointer}
.btn{font-size:14px;padding:10px 16px;min-height:44px}
.rb{font-size:12px;padding:7px 4px;min-height:36px;white-space:nowrap;min-width:0}
.btn:hover,.rb:hover{background:#1c1922}
.btn:active,.rb:active{background:var(--fg);color:var(--o)}
.rb.sel{background:var(--foe);border-color:var(--foe-hi);color:var(--fg-hi)}
.btn.primary{background:var(--foe);border-color:var(--foe-hi);color:var(--fg-hi)}
.hint{font-size:11px;color:var(--muted);text-align:center}
.footrow{display:flex;align-items:center;gap:10px}
.footrow .hint{flex:1;min-width:0;text-align:left}
.btn.sm{font-size:12px;padding:6px 12px;min-height:36px;white-space:nowrap}
.ovbtns{display:flex;gap:10px;justify-content:center}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,4,6,.78);z-index:6;padding:12px}
.card2{padding:18px 18px 16px;text-align:center;max-width:320px;width:100%}
.overlay h2{font-family:var(--display);letter-spacing:0;margin:0 0 12px;font-size:15px;line-height:1.5;color:var(--fg-hi)}
.overlay p{margin:0 0 14px;color:var(--fg);font-size:13px}
.toast{position:absolute;left:50%;top:8px;transform:translate(-50%,0);background:var(--panel);color:var(--fg-hi);border:2px solid var(--fg);padding:5px 10px;font-size:12px;font-weight:500;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap;z-index:7}
.toast.show{opacity:1}
.menu{position:absolute;display:flex;gap:4px;z-index:5;padding:4px}
.menu button{font-family:var(--body);font-size:12px;font-weight:600;border:2px solid var(--fg);background:var(--panel);color:var(--fg);padding:8px 10px;cursor:pointer;min-height:36px;white-space:nowrap}
.menu button:active{background:var(--fg);color:var(--o)}
.menu button:disabled{opacity:.4;cursor:not-allowed}
#flash{position:fixed;inset:0;pointer-events:none;border:6px solid var(--foe);opacity:0;transition:opacity .12s;z-index:9}
#flash.on{opacity:1}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:8;display:none}
.ghost canvas{width:48px;height:48px;image-rendering:pixelated;display:block}
/* codex */
#codex{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,4,6,.82);z-index:20;padding:12px}
.codex{width:100%;max-width:520px;max-height:92%;display:flex;flex-direction:column;padding:10px 12px 12px}
.cx-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.cx-head h2{font-family:var(--display);font-size:12px;margin:0;color:var(--fg-hi)}
.cx-tabs{display:flex;gap:6px;margin-bottom:8px}
.cx-tab{flex:1;font-family:var(--body);font-weight:600;font-size:13px;padding:7px 4px;border:2px solid var(--muted);background:var(--panel);color:var(--muted);cursor:pointer}
.cx-tab.on{border-color:var(--fg);color:var(--o);background:var(--fg)}
.cx-body{overflow:auto;min-height:0;padding-right:2px}
.cx-item{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start;padding:8px 2px;border-bottom:2px solid var(--plum)}
.cx-item:last-child{border-bottom:0}
.cx-item canvas{width:48px;height:48px;image-rendering:pixelated;display:block;background:#3a3038;border:2px solid var(--fg)}
.cx-title{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cx-name{font-weight:700;font-size:14px;color:var(--fg-hi)}
.cx-cost{font-family:var(--display);font-size:9px;color:var(--gold)}
.cx-stat{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.cx-desc{font-size:13px;color:var(--fg);margin-top:3px;line-height:1.45}
.cx-desc .up{color:var(--muted)}
.cx-rules{font-size:13px;color:var(--fg);line-height:1.55}
.cx-rules p{margin:0 0 8px} .cx-rules b{color:var(--fg-hi)}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}.boardframe.shake{animation:none}}
.ovbtns{flex-wrap:wrap}
.overlay p.ovnote{margin:12px 0 0;font-size:12px;color:var(--muted)}
#ovBody:empty{display:none}
.join{display:flex;gap:8px;justify-content:center;margin:0 0 14px}
.join input{width:8.5ch;min-width:0;font-family:var(--display);font-size:14px;text-transform:uppercase;letter-spacing:.12em;text-align:center;background:var(--bg);color:var(--fg-hi);border:2px solid var(--fg);border-radius:0;padding:8px 6px;user-select:text;-webkit-user-select:text}
.join input::placeholder{color:var(--muted);font-family:var(--body);letter-spacing:0;font-size:13px}
.join input:focus{outline:2px solid var(--gold);outline-offset:2px}
.bigcode{font-family:var(--display);font-size:28px;letter-spacing:.15em;color:var(--gold);margin:2px 0 14px;user-select:text;-webkit-user-select:text}
.btn:disabled{opacity:.5;cursor:default}
.ib:disabled{opacity:.35;cursor:default}

/* lobby / meta screens */
#meta{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;overflow:hidden;background:var(--bg) repeating-conic-gradient(var(--bg2) 0 25%,var(--bg) 0 50%) 0 0/8px 8px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#meta[hidden]{display:none}
#mtoast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,0);background:var(--panel);color:var(--fg-hi);border:2px solid var(--fg);padding:6px 12px;font-size:13px;font-weight:500;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap;z-index:30}
#mtoast.show{opacity:1}
.mw{max-width:520px;margin:0 auto;padding:10px 12px 18px;display:flex;flex-direction:column;gap:10px}
.res{display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:10px;padding:6px 8px}
.res .cur{display:flex;align-items:center;font-family:var(--display);font-size:10px;color:var(--fg-hi)}
.tixs{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.tx{font-size:10px;color:var(--muted);border:2px solid var(--plum);padding:1px 4px;white-space:nowrap}
.tx b{color:var(--fg-hi);font-family:var(--display);font-size:8px}
.mtitle{font-family:var(--display);font-size:20px;text-align:center;color:var(--fg-hi);margin:8px 0 2px;letter-spacing:.05em}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px}
.hero .big{font-family:var(--display);font-size:22px;color:var(--gold)}
.hero .sub{font-size:13px;color:var(--fg)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .btn{width:100%}
.mfoot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.mh{font-family:var(--display);font-size:12px;color:var(--fg-hi);margin:4px 0 0}
.mh3{font-size:13px;color:var(--fg);margin:2px 0}
.mnote{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
.mback{display:flex;justify-content:center;margin-top:4px}
.muted{color:var(--muted)}

      if(!signing) signing=auth.signInAnonymously().then(c=>c.user).catch(e=>{ signing=null; throw {code:e.code||'auth/error',message:e.message}; });
      return signing;
    }
    function online(){
      db.goOnline();
      if(!watching){ watching=true;
        db.ref('.info/connected').on('value',s=>{ conn.v=!!s.val(); for(const h of conn.hs){ try{h(conn.v);}catch(e){} } });
        db.ref('.info/serverTimeOffset').on('value',s=>{ offset=s.val()||0; }); }
    }
    F={auth,db,signIn,online,conn,now:()=>Date.now()+offset,keep:()=>{keep=true;},kept:()=>keep};
    return F;
  }

  window.TC_ROOM_PROVIDER=function(){
    const f=init(); if(!f) return Promise.resolve(null);
    const {db}=f, rooms=new Map();
    async function join(name){
      if(!/^tc-[a-z0-9]{4}$/.test(name)) throw {code:'invalid_argument',message:'room name'};
      if(rooms.has(name)) return rooms.get(name);
      const user=await f.signIn();
      f.online();
      const myId=user.uid+'-'+TAB, base=db.ref('rooms/'+name+'/p'), me=base.child(myId);
      const others=new Map(), hs=new Set(), errs=new Set();
      let my={}, left=false, snap=null, queued=false;
      function build(){
        const arr=[{peer:myId,by:null,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:Object.freeze({...my}),updatedAt:performance.now()}];
        for(const [k,v] of others) arr.push({peer:k,by:null,isMe:k.startsWith(user.uid+'-'),sameTab:false,kind:'viewer',guest:false,presence:v.p,updatedAt:v.t});
        return (snap=Object.freeze(arr));
      }
      build();
      function notify(){ build(); if(queued) return; queued=true; setTimeout(()=>{ queued=false; if(left) return; const s=build(); for(const h of hs){ try{h({peers:s,joined:[],left:[],updated:[]});}catch(e){console.error(e);} } },0); }
      const onSet=s=>{ if(s.key===myId) return; others.set(s.key,{p:Object.freeze(s.val()||{}),t:performance.now()}); notify(); };
      const onRem=s=>{ if(others.delete(s.key)) notify(); };
      const onErr=e=>{ for(const fn of errs){ try{fn({code:'not_permitted',message:String((e&&e.message)||e)});}catch(_){} } };
      base.on('child_added',onSet,onErr); base.on('child_changed',onSet,onErr); base.on('child_removed',onRem,onErr);
      await me.onDisconnect().remove();
      const api={
        name,
        presence(patch){
          if(left) return Promise.reject({code:'invalid_argument',message:'left'});
          const up={}; for(const k in patch){ const v=patch[k]; if(v===null||v===undefined){ delete my[k]; up[k]=null; } else { my[k]=v; up[k]=v; } }
          notify(); return me.update(up).catch(e=>{ throw {code:'upstream_error',message:String((e&&e.message)||e)}; });
        },
        peers(){ return snap; },
        onPeers(h,onError){ hs.add(h); if(onError) errs.add(onError); setTimeout(()=>{ if(hs.has(h)) h({peers:build(),joined:snap,left:[],updated:[]}); },0); return ()=>{ hs.delete(h); if(onError) errs.delete(onError); }; },
        emit(){ return Promise.resolve(); }, on(){ return ()=>{}; },
        connected(){ return f.conn.v; },
        onConnection(h){ f.conn.hs.add(h); setTimeout(()=>h(f.conn.v),0); return ()=>f.conn.hs.delete(h); },
        leave(){
          if(left) return Promise.resolve(); left=true; rooms.delete(name);
          base.off('child_added',onSet); base.off('child_changed',onSet); base.off('child_removed',onRem); hs.clear(); errs.clear();
          // remove() is sent first; the onDisconnect() removal stays armed in case the page closes before it lands
          return me.remove().catch(()=>{}).then(()=>{ if(!rooms.size&&!f.kept()) db.goOffline(); });
        }
      };
      rooms.set(name,api);
      return api;
    }
    window.addEventListener('pagehide',()=>{ for(const r of [...rooms.values()]) r.leave(); });
    return Promise.resolve({join});
  };

  const QUEUES=/^(normal|gold|dia|outlaw)$/;
  const CH='abcdefghjkmnpqrstuvwxyz23456789';
  const code4=()=>Array.from({length:4},()=>CH[Math.floor(Math.random()*CH.length)]).join('');
  async function ready(){ const f=init(); if(!f) throw {code:'unavailable'}; const u=await f.signIn(); f.keep(); f.online(); return {f,uid:u.uid}; }
  window.TC_FB={
    // Pair with another player waiting in the same queue. The newer entry claims the oldest waiting one
    // (a transaction on its `r`) and hosts; the claimed player sees the room code appear in its own `r`.
    // Resolves {role:'h'|'g', code} or {bot:true} after timeoutMs, or {cancelled:true}.
    async findMatch(q,info,timeoutMs,token){
      if(!QUEUES.test(q)) throw {code:'invalid_argument'};
      const {f,uid}=await ready(), db=f.db, qref=db.ref('mm/'+q), me=qref.child(uid);
      await me.onDisconnect().remove();
      await me.set({t:firebase.database.ServerValue.TIMESTAMP,r:'',n:String(info&&info.name||'').slice(0,16)});
      const myT=(await me.child('t').once('value')).val();
      return await new Promise(resolve=>{
        let done=false, busy=false, iv=0, to=0;
        const finish=res=>{ if(done) return; done=true; clearInterval(iv); clearTimeout(to); me.child('r').off('value',onR); me.remove().catch(()=>{}); me.onDisconnect().cancel().catch(()=>{}); resolve(res); };
        const onR=s=>{ const v=s.val(); if(typeof v==='string'&&v.length===4) finish({role:'g',code:v}); };
        me.child('r').on('value',onR);
        if(token) token.abort=()=>finish({cancelled:true});   // leave the queue at once when the player cancels
        const closeMe=()=>me.child('r').transaction(cur=>(cur===''||cur===null)?'x':undefined);
        const tryPair=async()=>{
          if(done||busy) return; if(token&&token.cancelled){ finish({cancelled:true}); return; }
          busy=true;
          try{
            const now=f.now(), snap=await qref.orderByChild('t').limitToFirst(25).once('value'), cands=[];
            snap.forEach(ch=>{ const v=ch.val(); if(ch.key!==uid&&v&&v.r===''&&typeof v.t==='number'&&now-v.t<30000&&(v.t<myT||(v.t===myT&&ch.key<uid))) cands.push(ch.key); });
            for(const k of cands){
              if(done) break;
              const code=code4();
              let tr=null; try{ tr=await qref.child(k).child('r').transaction(cur=>(cur===''||cur===null)?code:undefined); }catch(e){ continue; }
              if(tr&&tr.committed&&tr.snapshot.val()===code){ await closeMe().catch(()=>{}); finish({role:'h',code}); return; }
            }
          }catch(e){}
          busy=false;
        };
        iv=setInterval(tryPair,1500); tryPair();
        to=setTimeout(async()=>{ if(done) return; try{ const tr=await closeMe(); if(tr.committed&&tr.snapshot.val()==='x') finish({bot:true}); }catch(e){ finish({bot:true}); } },timeoutMs);
      });
    },
    // remember my deck so bots in this queue can play it against someone else later
    async pushDeck(q,deck){ if(!QUEUES.test(q)) return; const {f,uid}=await ready(); await f.db.ref('dk/'+q+'/'+uid).set({d:deck.d,l:deck.l,n:String(deck.n||'').slice(0,16),t:firebase.database.ServerValue.TIMESTAMP}); },
    async pickDeck(q){ if(!QUEUES.test(q)) return null; const {f,uid}=await ready(); const s=await f.db.ref('dk/'+q).orderByChild('t').limitToLast(30).once('value'); const arr=[]; s.forEach(c=>{ if(c.key!==uid) arr.push(c.val()); }); return arr.length?arr[Math.floor(Math.random()*arr.length)]:null; },
    async lbSubmit(board,period,best,name){ const {f,uid}=await ready(); const ref=f.db.ref('lb/'+board+'/'+period+'/'+uid), n=String(name||'').slice(0,16);
      await ref.transaction(cur=>{ const b=Math.max(best|0,cur&&cur.b|0); return (!cur||cur.b<b||cur.n!==n)?{n,b,t:f.now()}:undefined; }); },
    async lbTop(board,period,n){ const {f,uid}=await ready(); const s=await f.db.ref('lb/'+board+'/'+period).orderByChild('b').limitToLast(n||10).once('value'); const arr=[]; s.forEach(c=>{ const v=c.val()||{}; arr.push({n:String(v.n||''),b:v.b|0,t:v.t||0,me:c.key===uid}); }); return arr.sort((a,b)=>b.b-a.b||a.t-b.t); },
    async lbRank(board,period){ const {f,uid}=await ready(); const mine=(await f.db.ref('lb/'+board+'/'+period+'/'+uid).once('value')).val(); if(!mine) return null;
      const s=await f.db.ref('lb/'+board+'/'+period).orderByChild('b').startAt((mine.b|0)+1).once('value'); return s.numChildren()+1; },
  };
})();
</script>

function newState(seed,cfg){

}
const kingCell=(side,r,c)=>S.kings[side].cell[0]===r&&S.kings[side].cell[1]===c;

// traps lie on the ground: soldiers walk over them, so they never block a path
const solidAt=(r,c)=>S.towers.find(t=>t.r===r&&t.c===c&&t.hp>0&&!TOWERS[t.type].trap);
const blocked=(r,c)=>kingCell('you',r,c)||kingCell('foe',r,c)||!!solidAt(r,c);
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];

// open cells next to (r0,c0); `extra` is a cell treated as blocked (a tower about to be placed)
function seedsAround(r0,c0,extra){
  const out=[];
  for(const [dr,dc] of DIRS){const r=r0+dr,c=c0+dc; if(r<0||c<0||r>=N||c>=N) continue;
    if(blocked(r,c)||(extra&&extra[0]===r&&extra[1]===c)) continue; out.push([r,c]);}
  return out;
}
// steps to reach the seed cells (seeds = 1)
function bfs(seeds, extra){
  const d=Array.from({length:N},()=>Array(N).fill(Infinity)), q=[];
  for(const [r,c] of seeds){ d[r][c]=1; q.push([r,c]); }
  while(q.length){const [r,c]=q.shift();
    for(const [dr,dc] of DIRS){const nr=r+dr,nc=c+dc; if(nr<0||nc<0||nr>=N||nc>=N) continue;
      if(blocked(nr,nc)||(extra&&extra[0]===nr&&extra[1]===nc)) continue;
      if(d[nr][nc]>d[r][c]+1){d[nr][nc]=d[r][c]+1;q.push([nr,nc]);}}}
  return d;
}
function computeDist(target, extra){ const [kr,kc]=S.kings[target].cell; return bfs(seedsAround(kr,kc,extra),extra); }
// a side's flag is a rally point: its soldiers walk to the flag first, then on to the enemy king
const flagOf=side=>S.towers.find(t=>t.side===side&&t.type==='banner'&&t.hp>0)||null;
function refreshDist(){
  S.dist.you=computeDist('foe'); S.dist.foe=computeDist('you');
  for(const side of ['you','foe']){ const f=flagOf(side); S.rally[side]=f?bfs(seedsAround(f.r,f.c)):null; }
}
function kingReachable(side,d){const [kr,kc]=S.kings[side].cell;return DIRS.some(([dr,dc])=>{const a=kr+dr,b=kc+dc;return a>=0&&b>=0&&a<N&&b<N&&d[a][b]<Infinity;});}
function spawnCells(side){
  const out=[], [kr,kc]=S.kings[side].cell;
  for(const [dr,dc] of DIRS){const r=kr+dr,c=kc+dc; if(r<0||c<0||r>=N||c>=N) continue;
    if(!blocked(r,c)&&S.dist[side][r][c]<Infinity) out.push([r,c]);}
  return out;
}
// cells a side's soldiers walk through from their spawn to the enemy king (shortest-path walk)
function pathCells(side){
  const d=S.dist[side], out=new Set();
  for(const [r0,c0] of spawnCells(side)){ let r=r0,c=c0;
    for(let i=0;i<N*N;i++){ out.add(r*N+c); let nr=r,nc=c,bd=d[r][c];
      for(const [dr,dc] of DIRS){const a=r+dr,b=c+dc; if(a<0||b<0||a>=N||b>=N) continue; if(d[a][b]<bd){bd=d[a][b];nr=a;nc=b;}}
      if(nr===r&&nc===c) break; r=nr;c=nc; } }
  return out;
}
// each side owns the half next to its king; on odd boards the middle row belongs to no one
function ownHalf(side,r){const h=Math.floor(N/2); return side==='you'?r>=N-h:r<h;}
function nearOwnSoldier(side,r,c){return S.soldiers.some(s=>s.side===side&&s.hp>0&&Math.abs(Math.round(s.y)-r)<=1&&Math.abs(Math.round(s.x)-c)<=1);}
const inDeck=(side,type)=>!S.decks[side]||S.decks[side].includes(type);
function canPlace(side,r,c,type){
  if(!inDeck(side,type)) return {ok:false,why:'덱에 없는 타워입니다'};
  if(r<0||c<0||r>=N||c>=N||blocked(r,c)||towerAt(r,c)) return {ok:false,why:'빈 칸이 아닙니다'};
  if(S.soldiers.some(s=>s.hp>0&&Math.round(s.y)===r&&Math.round(s.x)===c)) return {ok:false,why:'병사가 서 있습니다'};
  if(!ownHalf(side,r)&&!nearOwnSoldier(side,r,c)) return {ok:false,why:'내 진영 또는 아군 병사 주변 1칸만'};
  const def=TOWERS[type];
  if(def.max&&S.towers.filter(t=>t.side===side&&t.type===type&&t.hp>0).length>=def.max) return {ok:false,why:`${def.name}은 ${def.max}개까지`};
  if(!def.trap){ const dY=computeDist('foe',[r,c]), dF=computeDist('you',[r,c]);
    if(!kingReachable('you',dY)||!kingReachable('foe',dF)) return {ok:false,why:'길이 완전히 막힙니다'}; }

function previewState(side,type,r,c,mana){ // what a drop here would do

  if(mana<TOWERS[type].cost) return {ok:false,why:'마나 부족',mode:'place'};

function place(side,type,r,c){
  const def=TOWERS[type]; if(!def) return false;

  if(!pv.ok){ if(side===ME){toast(MODE==='pvp'?`설치 실패: ${pv.why}`:pv.why);sfx('error');} return false; }
  if(pv.mode==='up'){ return upgrade(side,towerAt(r,c)); }

  const cl=Math.max(1,Math.min(10,S.lv[side][type]|0||1)), hp=Math.round(def.hp*cardMul(cl));
  S.towers.push({side,type,r,c,lvl:1,cl,hp,maxhp:hp,cd:def.spawn||def.gcd0||0,built:S.t,born:S.t,hitAt:-9,cnt:0,ramp:0,act:0,rcd:0,tg:null,bDmg:0,bSpd:1});

}
function upgrade(side,t){

}
const refundOf=t=>TOWERS[t.type].cost*t.lvl*0.25;

function sellTower(side,t){

function spawnWave(){
  S.wave++;
  const base=2+Math.floor(S.wave/3);
  // both sides get the same soldiers each wave; only the chosen +1 differs
  const common=[];
  for(let i=0;i<base;i++){const roll=S.rng(); common.push(roll<0.15?'siege': roll<0.35?'brute': roll<0.6?'scout':'footman');}
  for(const side of ['you','foe']){
    const cells=spawnCells(side); if(!cells.length) continue;
    const list=common.slice();
    if(side===AI_SIDE&&!S.reinforce[side]){const r=S.rng(); S.reinforce[side]= r<0.35?'footman': r<0.6?'scout': r<0.8?'brute':'siege';}
    if(S.reinforce[side]) list.push(S.reinforce[side]);
    const pw=SOLDIER_BOOST?S.boost:1;
    for(const type of list){ const [r,c]=cells[Math.floor(S.rng()*cells.length)]; spawnSoldier(side,type,r,c,pw); }
    if(side===AI_SIDE) S.reinforce[side]=null;
  }
  sfx('wave');
}
// a barracks (or golem workshop) sends a unit out of the free neighbour cell nearest the enemy king
function spawnFrom(t,def){
  const d=S.dist[t.side]; let best=null,bd=Infinity;
  for(const [dr,dc] of DIRS){ const r=t.r+dr,c=t.c+dc; if(r<0||c<0||r>=N||c>=N||blocked(r,c)) continue; const v=d[r][c]; if(v<bd||(!best&&v===Infinity)){bd=v;best=[r,c];} }
  if(!best) return;
  spawnSoldier(t.side,def.unit||'footman',best[0],best[1],(SOLDIER_BOOST?S.boost:1)*cardMul(t.cl)*(def.unitMul||1));
  vfxPoof(best[1],best[0]); if(S.stat) S.stat(t,1,'spawn');
}
const dist=(a,b)=>hyp(a.x-b.x,a.y-b.y);
// soldier hits on soldiers, towers and kings; a 'vulnerable' soldier takes more
function damage(obj,amt,bySide){ if(obj.vulT>0) amt*=1+obj.vul; obj.hp-=amt;obj.hitAt=S.t;obj.seen=S.t;hit(obj.x??obj.c,obj.y??obj.r,bySide);}
// tower damage on a soldier (quiet: no hit flash, for beams and pulses)
function hurt(s,amt,t,quiet){ if(s.hp<=0||!(amt>0)) return; if(s.vulT>0) amt*=1+s.vul; s.hp-=amt; s.seen=S.t; if(!quiet) s.hitAt=S.t; if(t) s.by=t; if(S.stat&&t) S.stat(t,amt,'dmg'); }
function burnOn(s,v,T,t){ if(s.hp<=0) return; s.brn=Math.max(s.brnT>0?s.brn:0,v); s.brnT=Math.max(s.brnT,T); if(t) s.by=t; }
function poisonOn(s,v,T,t){ if(s.hp<=0) return; s.psn=Math.max(s.psnT>0?s.psn:0,v); s.psnT=Math.max(s.psnT,T); if(t) s.by=t; }
function stunOn(s,T,t){ s.stun=Math.max(s.stun||0,T); if(S.stat&&t) S.stat(t,T,'stun'); }

function updateSoldier(s,dt){
  if(s.stun>0) return;   // frozen: no move, no attack
  const def=SOLDIERS[s.type], enemy=other(s.side);
  const hs=s.haste>0?1+s.hv:1, spdMul=(s.slow>0?0.6:1)*hs, dmgMul=s.pw||1;
  s.cd-=dt*hs; s.moving=false;
  const structMul=def.structMul||1;
  let target=null, best=0.75;
  if(!def.siege) for(const e of S.soldiers){ if(e.side===enemy&&e.hp>0){const d=dist(s,e); if(d<best){best=d;target=e;}}}
  if(target){ if(s.cd<=0){damage(target,def.dmg*dmgMul,enemy);s.cd=def.cd;sfx('hit'); if(target.hp<=0) sfx('death');} return; }
  const r=Math.round(s.y), c=Math.round(s.x), [kr,kc]=S.kings[enemy].cell;
  if(Math.abs(kr-r)+Math.abs(kc-c)===1 && hyp(kr-s.y,kc-s.x)<1.15){
    if(s.cd<=0){const dmg=def.dmg*dmgMul*structMul; S.kings[enemy].hp-=dmg; S.kings[enemy].hitAt=S.t; s.cd=def.cd; hit(kc,kr,enemy); vfxNum(kc,kr,dmg,enemy); sfx('kinghit'); if(enemy===ME) kingFlash();} return; }
  let d=S.dist[s.side];
  if(s.via){ const f=flagOf(s.side), rd=S.rally[s.side];
    if(!f||!rd||!(rd[r]?.[c]<Infinity)) s.via=false;   // no flag, or it cannot be reached from here
    else if(Math.abs(f.r-r)+Math.abs(f.c-c)===1&&hyp(f.r-s.y,f.c-s.x)<1.15) s.via=false;   // reached the flag
    else d=rd; }
  let nr=r,nc=c,bd=d[r]?.[c]??Infinity;
  for(const [dr,dc] of DIRS){const a=r+dr,b=c+dc; if(a<0||b<0||a>=N||b>=N) continue; if(d[a][b]<bd){bd=d[a][b];nr=a;nc=b;}}
  const noPath=!(bd<Infinity);
  let tw=null;
  for(const [dr,dc] of DIRS){const t=towerAt(r+dr,c+dc); if(t&&t.side===enemy){ const td=TOWERS[t.type]; if(noPath||def.siege||td.wall||td.taunt||S.rng()<0.02){tw=t;break;} }}
  if(tw&&hyp(tw.r-s.y,tw.c-s.x)<1.2){ if(s.cd<=0){damage(tw,def.dmg*dmgMul*structMul,enemy);s.cd=def.cd;sfx('hit');
      const td=TOWERS[tw.type]; if(td.thorns) hurt(s,td.thorns*tpow(tw),tw);
      if(tw.hp<=0){vfxRubble(tw);S.towers=S.towers.filter(x=>x.hp>0);refreshDist();sfx('death');}} return; }
  if(noPath){ const dir=s.side==='you'?-1:1; s.y+=dir*def.spd*spdMul*dt*0.3; s.y=Math.max(0,Math.min(N-1,s.y)); s.moving=true; return; }
  const dx=nc-s.x, dy=nr-s.y, L=hyp(dx,dy), step=def.spd*spdMul*dt;
  s.moving=true; if(L<=step){s.x=nc;s.y=nr;} else {s.x+=dx/L*step;s.y+=dy/L*step;}
  // keep a little room between soldiers of one side, but never push one off the board or into a tower
  const ox=s.x, oy=s.y;
  for(const o of S.soldiers){ if(o!==s&&o.hp>0&&o.side===s.side){const dd=dist(s,o); if(dd<0.35&&dd>0){const k=Math.min(0.02,dt*0.5);s.x+=(s.x-o.x)/dd*k;s.y+=(s.y-o.y)/dd*k;}}}
  s.x=Math.max(0,Math.min(N-1,s.x)); s.y=Math.max(0,Math.min(N-1,s.y));
  const r2=Math.round(s.y), c2=Math.round(s.x); if((r2!==Math.round(oy)||c2!==Math.round(ox))&&blocked(r2,c2)){ s.x=ox; s.y=oy; }
}
// ---- targeting ----
function nearestEnemy(p,range,enemy){ let tg=null,best=range; for(const s of S.soldiers) if(s.side===enemy&&s.hp>0){const d=dist(p,s); if(d<=best){best=d;tg=s;}} return tg; }
function nearestN(p,range,enemy,k){ const a=[]; for(const s of S.soldiers) if(s.side===enemy&&s.hp>0){ const d=dist(p,s); if(d<=range) a.push([d,a.length,s]); } a.sort((x,y)=>x[0]-y[0]||x[1]-y[1]); return a.slice(0,k).map(x=>x[2]); }
function nearestBeyond(p,range,minr,enemy){ let tg=null,best=range; for(const s of S.soldiers) if(s.side===enemy&&s.hp>0){const d=dist(p,s); if(d>=minr&&d<=best){best=d;tg=s;}} return tg; }
// the enemy soldier that has come closest to this tower's own king
function mostAdvanced(t,range,enemy){ const [kr,kc]=S.kings[t.side].cell, p={x:t.c,y:t.r}; let tg=null,best=Infinity; for(const s of S.soldiers) if(s.side===enemy&&s.hp>0&&dist(p,s)<=range){ const d=hyp(s.x-kc,s.y-kr); if(d<best){best=d;tg=s;} } return tg; }
function inRange(p,range,enemy){ const a=[]; for(const s of S.soldiers) if(s.side===enemy&&s.hp>0&&dist(p,s)<=range) a.push(s); return a; }
// growth (sapling) and linked neighbours (octopus)
function extraMul(t,def){ let k=1;
  if(def.growT) k*=1+def.growS*Math.min(def.growMax,Math.floor((S.t-t.born)/def.growT));
  if(def.link){ let n=0; for(const [dr,dc] of DIRS){ const o=towerAt(t.r+dr,t.c+dc); if(o&&o.side===t.side&&o.type===t.type) n++; } k*=1+def.link*n; }
  return k; }
const growStage=t=>{ const def=TOWERS[t.type]; if(!def.growT) return 0; const g=Math.min(def.growMax,Math.floor((S.t-t.born)/def.growT)); return g>=12?2:g>=5?1:0; };

function updateTower(t,dt){
  if(t.hp<=0) return;
  const def=TOWERS[t.type], p={x:t.c,y:t.r}, enemy=other(t.side);
  const range=def.range+(def.trap?0:0.25*(t.lvl-1));
  t.cd-=dt*(t.bSpd||1);
  if(def.raise) t.rcd=Math.max(0,(t.rcd||0)-dt);
  if(S.t-t.built<0.3) return; // under construction
  const m=tpow(t)*(1+(t.bDmg||0))*extraMul(t,def);
  if(def.spawn){ if(t.cd<=0){ t.cd=def.spawn-2*(t.lvl-1); spawnFrom(t,def); } return; }
  if(def.gcd){ if(t.cd<=0){ t.cd=def.gcd; globalFx(t,def,m); } return; }
  if(def.trap){ trapStep(t,def,m); return; }
  if(def.haste){ const v=Math.min(0.8,def.haste*m); let n=0; for(const s of S.soldiers) if(s.side===t.side&&s.hp>0&&dist(p,s)<=range){ s.haste=0.25; s.hv=Math.max(s.hv||0,v); n++; } if(n&&S.stat&&S.tick%20===0) S.stat(t,n,'haste'); return; }
  if(def.heal){ if(t.cd<=0){t.cd=def.cd; for(const s of S.soldiers) if(s.side===t.side&&s.hp>0&&s.hp<s.maxhp&&dist(p,s)<=range){s.hp=Math.min(s.maxhp,s.hp+def.heal*m);vfxHeal(s.x,s.y); if(S.stat) S.stat(t,def.heal*m,'heal');}} return; }
  if(def.slow){ if(t.cd<=0){t.cd=def.cd; let any=false; for(const s of S.soldiers) if(s.side===enemy&&s.hp>0&&dist(p,s)<=range){s.slow=1;hurt(s,def.dmg*m,t,true);any=true;vfxIce(s.x,s.y);} if(any) vfxFrost(p.x,p.y,range);} return; }
  if(def.pulse){
    if(t.cd>0) return; const hitL=inRange(p,range,enemy); if(!hitL.length) return; t.cd=def.cd;
    for(const s of hitL){ if(def.dmg) hurt(s,def.dmg*m,t,true); if(def.psn) poisonOn(s,def.psn*m,def.psnT,t); if(def.burn) burnOn(s,def.burn*m,def.burnT,t);
      if(def.vul){ s.vul=Math.max(s.vulT>0?s.vul:0,def.vul); s.vulT=Math.max(s.vulT,def.vulT); } }
    vfxPulse(t,range,hitL); return; }
  if(def.beam){
    let tg=t.tg; if(!tg||tg.hp<=0||tg.side!==enemy||dist(p,tg)>range){ const nt=nearestEnemy(p,range,enemy); if(nt!==tg) t.ramp=0; tg=nt; t.tg=tg||null; }
    if(!tg){ t.ramp=0; return; }
    hurt(tg,def.beam*m*(1+t.ramp)*dt,t,true); t.ramp=Math.min(def.rampMax,t.ramp+def.ramp*dt); return; }
  if(def.pull){
    if(t.act>0){ t.act-=dt;
      for(const s of S.soldiers) if(s.side===enemy&&s.hp>0){ const d=dist(p,s); if(d>range) continue; hurt(s,def.dps*m*dt,t,true);
        if(d>0.65){ const k=Math.min(d-0.65,def.pull*dt), nx=s.x+(p.x-s.x)/d*k, ny=s.y+(p.y-s.y)/d*k, r0=Math.round(s.y), c0=Math.round(s.x), r1=Math.round(ny), c1=Math.round(nx);
          if((r1===r0&&c1===c0)||!blocked(r1,c1)){ s.x=nx; s.y=ny; } } }
      return; }
    if(t.cd>0||!nearestEnemy(p,range,enemy)) return;
    t.cd=def.cd; t.act=def.pullT*(1+0.25*(t.lvl-1)); vfxHole(t,range,t.act); sfx('hole'); return; }
  if(def.siegeT){
    if(t.cd>0) return; let tg=null,b=range; for(const o of S.towers) if(o.side===enemy&&o.hp>0){ const d=hyp(o.c-t.c,o.r-t.r); if(d<=b){b=d;tg=o;} }
    if(!tg) return; t.cd=def.cd; damage(tg,def.dmg*m,enemy); if(S.stat) S.stat(t,def.dmg*m,'tower'); vfxRock(t,tg); sfx('fire'); return; }
  if(def.meteor){
    if(t.cd>0) return; let best=null,bn=0;
    for(const s of S.soldiers) if(s.side===enemy&&s.hp>0&&dist(p,s)<=range){ let n=0; for(const o of S.soldiers) if(o.side===enemy&&o.hp>0&&dist(s,o)<=def.splash) n++; if(n>bn){bn=n;best=s;} }
    if(!best) return; t.cd=def.cd;
    const b={side:t.side,x:best.x,y:best.y,at:S.tick+Math.round(def.delay*TPS),t0:S.tick,dmg:def.dmg*m,r:def.splash,burn:(def.burn||0)*m,burnT:def.burnT||0,src:t};
    S.bombs.push(b); vfxMeteorCall(t,b); sfx('meteor'); return; }
  if(def.melee){
    if(t.cd>0) return; const hitL=inRange(p,range,enemy); if(!hitL.length) return; t.cd=def.cd;
    for(const s of hitL) hurt(s,def.dmg*m,t); vfxSlash(t,range); sfx('slash'); return; }
  if(def.chain){
    if(t.cd>0) return;
    const first=nearestEnemy(p,range,enemy); if(!first) return;
    t.cd=def.cd;
    const hitL=[first]; let cur=first;
    for(let k=1;k<def.chain;k++){ let nx=null,b=def.jump; for(const s of S.soldiers) if(s.side===enemy&&s.hp>0&&!hitL.includes(s)){const d=dist(cur,s); if(d<=b){b=d;nx=s;}} if(!nx) break; hitL.push(nx); cur=nx; }
    let dmg=def.dmg*m; for(const s of hitL){ hurt(s,dmg,t); dmg*=0.8; }
    vfxBolt(p,hitL); sfx('zap'); return;
  }
  if(def.bounce){
    if(t.cd>0) return; const first=nearestEnemy(p,range,enemy); if(!first) return; t.cd=def.cd;
    const path=[first], seen=new Set([first]); let cur=first; const nb=def.bounce+(t.lvl-1);
    for(let k=0;k<nb;k++){ let nx=null,b=def.jump,ny=null,b2=def.jump;
      for(const s of S.soldiers) if(s.side===enemy&&s.hp>0&&s!==cur){ const d=dist(cur,s); if(!seen.has(s)){ if(d<=b){b=d;nx=s;} } else if(d<=b2){b2=d;ny=s;} }
      const nn=nx||ny; if(!nn) break; path.push(nn); seen.add(nn); cur=nn; }
    let dmg=def.dmg*m; for(const s of path){ hurt(s,dmg,t); dmg*=1+def.grow; }
    vfxBounce(p,path); sfx('bounce'); return; }
  if(def.snipe){
    if(t.cd>0) return;
    let tg=null,best=-1; for(const s of S.soldiers) if(s.side===enemy&&s.hp>0&&dist(p,s)<=range&&s.hp>best){best=s.hp;tg=s;}
    if(!tg) return;
    t.cd=def.cd; hurt(tg,def.dmg*m,t); vfxSnipe(p,tg); sfx('snipe'); return;
  }
  if(def.pierce){
    if(t.cd>0) return; const tg=nearestEnemy(p,range,enemy); if(!tg) return; t.cd=def.cd;
    const dx=tg.x-p.x, dy=tg.y-p.y, L=hyp(dx,dy)||1, ux=dx/L, uy=dy/L, len=range+0.3;
    for(const s of S.soldiers) if(s.side===enemy&&s.hp>0){ const rx=s.x-p.x, ry=s.y-p.y, al=rx*ux+ry*uy; if(al<0||al>len) continue;
      if(Math.abs(rx*uy-ry*ux)<=def.pierce){ hurt(s,def.dmg*m,t); if(def.burn) burnOn(s,def.burn*m,def.burnT,t); } }
    vfxPierce(t,p.x+ux*len,p.y+uy*len,def.burn?'fire':'bolt'); sfx(def.burn?'flame':'snipe'); return; }
  if(!def.dmg||t.cd>0) return;
  // projectile towers: arrow, cannon, bb, firesp, mortar, icesp, skelmage, sapling, octopus, rocket
  let targets;
  if(def.multi) targets=nearestN(p,range,enemy,def.multi);
  else { const tg=def.minr?nearestBeyond(p,range,def.minr,enemy):def.front?mostAdvanced(t,range,enemy):nearestEnemy(p,range,enemy); targets=tg?[tg]:[]; }
  if(!targets.length) return;
  t.cd=def.cd; t.cnt++;
  for(const tg of targets){
    vfxShot(def.fx||(def.splash?'ball':'arrow'),t.side,p.x,p.y,tg.x,tg.y,def.splash||0);
    const hitL=def.splash?inRange(tg,def.splash,enemy):[tg];
    for(const s of hitL){ let d=def.dmg*m; if(def.pct) d+=s.maxhp*(def.pct+0.025*(t.lvl-1))*cardMul(t.cl);
      hurt(s,d,t); if(def.burn) burnOn(s,def.burn*m,def.burnT,t); if(def.psn) poisonOn(s,def.psn*m,def.psnT,t);
      if(def.freeze){ s.slow=1; if(t.cnt%def.every===0){ stunOn(s,def.freeze,t); vfxFreeze(s); } } }
  }
  if(def.splash) sfx('fire'); else if(def.fx==='pellet') sfx('pellet');
}
function trapStep(t,def,m){
  const p={x:t.c,y:t.r}, enemy=other(t.side);
  if(def.trap==='mine'){
    if(S.t-t.built<1) return;
    for(const s of S.soldiers) if(s.side===enemy&&s.hp>0&&dist(p,s)<=def.range){
      for(const e of inRange(p,def.splash,enemy)) hurt(e,def.dmg*m,t);
      t.hp=0; t.boom=true; vfxMine(p.x,p.y,def.splash); return; }
    return; }
  if(t.cd>0) return; let n=0;
  for(const s of S.soldiers) if(s.side===enemy&&s.hp>0&&dist(p,s)<=def.range){ hurt(s,def.dmg*m,t); s.slow=1; n++; }
  if(n){ t.cd=def.cd; t.hp-=n; vfxSpike(p.x,p.y); sfx('spike'); }
}
// legendary towers that act on the whole board
function globalFx(t,def,m){
  const enemy=other(t.side);
  if(def.freezeAll){ const foes=S.soldiers.filter(s=>s.side===enemy&&s.hp>0); if(!foes.length){ t.cd=1; return; }
    const d=def.freezeAll+0.4*(t.lvl-1); for(const s of foes) stunOn(s,d,t); vfxClock(t,d); sfx('freeze'); return; }
  if(def.strikes){ const pool=S.soldiers.filter(s=>s.side===enemy&&s.hp>0); if(!pool.length){ t.cd=1; return; }
    for(let i=0;i<def.strikes&&pool.length;i++){ const s=pool.splice(Math.floor(S.rng()*pool.length),1)[0]; hurt(s,def.dmg*m,t); stunOn(s,def.stun,t); vfxThunder(s); }
    sfx('thunder'); return; }
  if(def.healAll){ const k=Math.min(2,m), hs=S.soldiers.filter(s=>s.side===t.side&&s.hp>0&&s.hp<s.maxhp), ht=S.towers.filter(o=>o.side===t.side&&o.hp>0&&o.hp<o.maxhp);
    if(!hs.length&&!ht.length){ t.cd=1; return; }
    for(const s of hs){ const v=Math.min(s.maxhp-s.hp,s.maxhp*def.healAll*k); s.hp+=v; vfxHeal(s.x,s.y); if(S.stat) S.stat(t,v,'heal'); }
    for(const o of ht) o.hp=Math.min(o.maxhp,o.hp+o.maxhp*def.healT*k);
    vfxAngel(t); sfx('heal'); return; }
}
// statue / battery: each tower takes the best aura of each kind around it (they do not stack)
function computeAuras(){
  for(const t of S.towers){ t.bDmg=0; t.bSpd=1; }
  for(const a of S.towers){ const d=TOWERS[a.type]; if(!(d.auraDmg||d.auraSpd)||a.hp<=0||S.t-a.built<0.3) continue;
    const rg=d.range+0.25*(a.lvl-1)+1e-9, v=(d.auraDmg||d.auraSpd)*tpow(a);
    for(const t of S.towers) if(t!==a&&t.side===a.side&&t.hp>0&&hyp(t.c-a.c,t.r-a.r)<=rg){ if(d.auraDmg) t.bDmg=Math.max(t.bDmg,v); else t.bSpd=Math.max(t.bSpd,1+v); } }
}
function bombStep(){
  if(!S.bombs.length) return; const keep=[];
  for(const b of S.bombs){ if(b.at>S.tick){ keep.push(b); continue; } const enemy=other(b.side);
    for(const s of S.soldiers) if(s.side===enemy&&s.hp>0&&hyp(s.x-b.x,s.y-b.y)<=b.r){ hurt(s,b.dmg,b.src); if(b.burn) burnOn(s,b.burn,b.burnT,b.src); }
    vfxMeteorHit(b); }
  S.bombs=keep;
}
// burn / poison ticks, and the timers of every status
function statusStep(dt){
  for(const s of S.soldiers){ if(s.hp<=0) continue;
    if(s.brnT>0){ const v=s.brn*Math.min(dt,s.brnT); s.hp-=v; s.seen=S.t; if(S.stat&&s.by) S.stat(s.by,v,'dmg'); s.brnT-=dt; if(s.brnT<=0){s.brn=0;s.brnT=0;} }
    if(s.psnT>0){ const v=s.psn*Math.min(dt,s.psnT); s.hp-=v; s.seen=S.t; if(S.stat&&s.by) S.stat(s.by,v,'dmg'); s.psnT-=dt; if(s.psnT<=0){s.psn=0;s.psnT=0;} }
    if(s.vulT>0){ s.vulT-=dt; if(s.vulT<=0){s.vulT=0;s.vul=0;} }
    if(s.stun>0) s.stun=Math.max(0,s.stun-dt);

function raiseDead(dead){
  for(const s of dead) for(const t of S.towers){ const d=TOWERS[t.type];
    if(!d.raise||t.hp<=0||t.side===s.side||t.rcd>0||S.t-t.built<0.3) continue;

}

// ---- AI (plays either side; rows are written for the top side and mirrored for the bottom) ----
function aiThink(side){
  const opp=other(side), m=S.mana[side], rng=S.rng, h=Math.floor(N/2), center=(N-1)/2;
  const R=r=>side==='foe'?r:N-1-r;
  const deck=S.decks[side]||TKEYS, roleOf=k=>TOWERS[k].role;
  const threats=S.soldiers.filter(s=>s.side===opp&&s.hp>0);
  const heavy=threats.filter(s=>s.type==='brute'||s.type==='siege').length;
  const mine=S.towers.filter(t=>t.side===side);
  const counts=k=>mine.filter(t=>t.type===k).length;
  const oppTowers=S.towers.filter(t=>t.side===opp);
  const oppGuns=oppTowers.filter(t=>isAtk(t.type));
  const myGuns=mine.filter(t=>isAtk(t.type));
  const scale=N/10;
  let choice=null;
  const capped=S.aiCap&&side===AI_SIDE&&mine.length>=S.aiCap;   // easy stages: the AI only keeps a few towers (it can still upgrade them)
  // the least-built tower of a role that we can afford now
  const want=(role,cond,lim)=>{ if(choice||capped||!cond) return; let best=null,bc=1e9;
    for(const k of deck){ if(roleOf(k)!==role) continue; const c=counts(k), mx=Math.min(lim,TOWERS[k].max||99); if(c<mx&&TOWERS[k].cost<=m&&c<bc){bc=c;best=k;} }
    if(best) choice=best; };
  // an expensive tower in the deck not built yet (laser, meteor, legendaries...): build it when affordable, otherwise often save up for it
  const big=deck.filter(k=>TOWERS[k].cost>=6&&counts(k)<1).sort((a,b)=>TOWERS[a].cost-TOWERS[b].cost)[0];
  const [kr0,kc0]=S.kings[side].cell, danger=threats.filter(s=>hyp(s.x-kc0,s.y-kr0)<3.5).length;
  if(big&&!capped&&S.wave>=1){ if(m>=TOWERS[big].cost) choice=big; else if(danger<3&&rng()<0.6) return; }
  want('aoe', threats.length>=3, Math.ceil(2*scale)+1);
  want('heavy', heavy>=1, 2);
  want('tank', threats.length>=2, 1);
  want('global', S.wave>=1, 1);
  want('eco', S.wave>=1&&threats.length<2, 1);
  want('ctrl', S.wave>=2, 2);
  want('dps', true, Math.max(2,Math.round(3*scale)));
  want('long', S.wave>=2, 2);
  want('spawn', S.wave>=2, 1);
  want('grave', S.wave>=2&&threats.length>=2, 1);
  want('sup', myGuns.length>=2, 1);
  want('anti', oppTowers.length>=3, 1);
  want('rally', S.wave>=1&&oppGuns.length>=2, 1);
  want('heal', S.wave>=3, 1);
  want('buffS', S.wave>=3, 1);
  want('trap', S.wave>=1&&rng()<0.6, 3);
  if(!choice&&rng()<0.4) want('wall', true, 3);
  if(!choice&&m>=3&&rng()<0.35){ const ups=mine.filter(t=>isAtk(t.type)&&t.lvl<3&&TOWERS[t.type].cost<=m); if(ups.length){upgrade(side,ups[Math.floor(rng()*ups.length)]);return;} }
  if(!choice&&!capped&&m>=9){ const atk=deck.filter(k=>isAtk(k)&&TOWERS[k].cost<=m&&(!TOWERS[k].max||counts(k)<TOWERS[k].max)); if(atk.length) choice=atk[Math.floor(rng()*atk.length)]; }
  if(!choice) return;
  const role=roleOf(choice), def=TOWERS[choice];
  const front=[Math.max(1,h-2),h-1], back=[1,Math.min(2,h-1)], all=[]; for(let r=1;r<h;r++) all.push(r);
  const rowsFor={wall:front,tank:front,rally:front,spawn:front,buffS:front,anti:front,heal:back,eco:back,global:back,long:back};
  const rows=[...new Set(rowsFor[role]||all)].map(R);
  const attack=role==='dps'||role==='aoe'||role==='heavy'||role==='ctrl'||role==='grave';
  const path=(role==='trap'||role==='wall'||role==='tank')?pathCells(opp):null;
  const cand=[], seen=new Set();
  const push=(r,c)=>{const k=r*N+c; if(seen.has(k)||r<0||c<0||r>=N||c>=N||blocked(r,c)||towerAt(r,c)) return; seen.add(k);
    let score=rng();
    if(attack||role==='long'){ for(const s of threats) score+=Math.max(0,3-hyp(s.x-c,s.y-r))*0.5; score+=Math.abs(c-center)<=N*0.25?0.8:0; score-=Math.abs(c-center)*0.1; }
    if(role==='wall'){ score+=S.dist[opp][r][c]<Infinity?1:0; score+=Math.abs(c-center)<=1.5?0.6:0; if(path.has(k)) score+=1.2; }
    if(role==='tank'){ if(path.has(k)) score+=2; score+=Math.abs(c-center)<=1.5?0.5:0; }
    if(role==='trap'){ score+=path.has(k)?2.5:-1; score+=Math.abs(c-center)<=1.5?0.3:0; }
    if(role==='spawn'||role==='heal'||role==='buffS'){ score+=Math.abs(c-center)<=1.5?1:0; }
    if(role==='eco'||role==='global'){ score-=Math.abs(c-center)*0.05; }
    if(role==='anti'){ for(const o of oppTowers) if(hyp(o.c-c,o.r-r)<=def.range) score+=1; }
    if(role==='sup'){ for(const o of myGuns) if(hyp(o.c-c,o.r-r)<=def.range+1e-9) score+=1.5; }
    if(def.link){ for(const [dr,dc] of DIRS){ const o=towerAt(r+dr,c+dc); if(o&&o.side===side&&o.type===choice) score+=1.5; } }
    // the flag goes in front of our half, on the column the opponent's guns cover least
    if(role==='rally'){ let cover=0; for(const t of oppGuns) cover+=Math.max(0,3-Math.abs(t.c-c)); score=score*0.3-cover*0.6-Math.abs(c-center)*0.05; }
    cand.push({r,c,score});};
  for(const r of rows) for(let c=0;c<N;c++) push(r,c);
  if(attack) for(const s of S.soldiers) if(s.side===side&&s.hp>0){const r0=Math.round(s.y),c0=Math.round(s.x); for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) push(r0+dr,c0+dc);}
  cand.sort((a,b)=>b.score-a.score);
  for(const k of cand.slice(0,8)){ if(place(side,choice,k.r,k.c)) return; }
}

// ---- simulation step (fixed 20Hz) ----
function winnerByHp(){ const a=S.kings.you.hp, b=S.kings.foe.hp; return a>b?'you':a<b?'foe':null; }
function step(dt){
  S.tick++; S.t=S.tick*TICK;
  if(TEST&&TEST.endAt&&S.tick===TEST.endAt){ endGame(winnerByHp()); return; }
  const boost=boostAt(S.tick); if(boost!==S.boost){ S.boost=boost; toast(SOLDIER_BOOST?`마나 재생·병사 능력치 x${boost}`:`마나 재생 x${boost}`); sfx('wave'); }
  for(const side of ['you','foe']) S.mana[side]=Math.min(MANA_MAX,S.mana[side]+(MANA_REGEN+wellBonus(side))*S.boost*dt);
  S.waveTimer-=dt; if(S.waveTimer<=0){S.waveTimer=WAVE_T;spawnWave();}
  if(AI_SIDE){ S.aiTimer-=dt; if(S.aiTimer<=0){S.aiTimer=(1.5+S.rng()*1.5)*S.aiSlow;aiThink(AI_SIDE);} }
  for(const s of S.soldiers){s.px=s.x;s.py=s.y;s.slow=Math.max(0,s.slow-dt*0.8);}
  computeAuras();
  for(const t of S.towers) updateTower(t,dt);
  bombStep();
  statusStep(dt);
  for(const s of S.soldiers) if(s.hp>0) updateSoldier(s,dt);
  for(const side of ['you','foe']){const k=S.kings[side]; k.cd-=dt; if(k.cd<=0){const kp={x:k.cell[1],y:k.cell[0]}; let tg=null,b=2.3; for(const s of S.soldiers) if(s.side===other(side)&&s.hp>0){const d=dist(kp,s); if(d<b){b=d;tg=s;}} if(tg){hurt(tg,10,null);k.cd=1.6;vfxShot('arrow',side,kp.x,kp.y,tg.x,tg.y,0);}}}
  const dead=S.soldiers.filter(s=>s.hp<=0);
  if(dead.length){ sfx('death'); for(const s of dead) vfxDeath(s); S.soldiers=S.soldiers.filter(s=>s.hp>0); raiseDead(dead); }
  if(S.towers.some(t=>t.hp<=0)){ if(S.menuTower&&S.menuTower.hp<=0) closeMenu(); for(const t of S.towers) if(t.hp<=0&&!t.boom) vfxRubble(t); S.towers=S.towers.filter(t=>t.hp>0);refreshDist(); }
  const youDown=S.kings.you.hp<=0, foeDown=S.kings.foe.hp<=0;
  if(youDown||foeDown) endGame(youDown&&foeDown?null:foeDown?'you':'foe');
}
function endGame(winner){
  S.over=true; S.running=false; closeMenu(); S.sel=null; S.hover=null;
  S.result=winner===null?'draw':winner===ME?'win':'lose';
  S.byKo=S.kings.you.hp<=0||S.kings.foe.hp<=0;
  sfx(S.result==='win'?'win':'lose');
  if(MODE==='pvp'&&NET){ NET.state='over'; NET.myRm=0; NET.oppRm=0; }
  showOver();
}
function stateHash(){
  let h=2166136261>>>0; const mix=v=>{h=Math.imul(h^(v|0),16777619)>>>0;};
  mix(S.tick); mix(S.n); mix(Math.round(S.kings.you.hp*1000)); mix(Math.round(S.kings.foe.hp*1000)); mix(Math.round(S.mana.you*1e6)); mix(Math.round(S.mana.foe*1e6)); mix(S.bombs.length);
  for(const t of S.towers){ mix(t.r*16+t.c); mix(TKEYS.indexOf(t.type)); mix(t.lvl); mix(t.cl); mix(Math.round(t.hp*1000)); mix(t.side==='you'?1:2); mix(t.cnt|0); mix(Math.round((t.ramp||0)*1000)); mix(Math.round((t.act||0)*1000)); }
  mix(S.soldiers.length);
  for(const s of S.soldiers){ mix(Math.round(s.x*1e6)); mix(Math.round(s.y*1e6)); mix(Math.round(s.hp*1000)); mix(s.via?1:0); mix(Math.round((s.stun||0)*1000)); mix(Math.round((s.brnT+s.psnT)*1000)); }
  return h;
}

function drawSprite(g,map,x,y,pk,rowFrom=0,flash=false){
  const sp=PAL[pk]||PAL.you;
  const col={o:PAL.o,a:sp.a,b:sp.b,c:sp.c,W:PAL.white,G:PAL.gold,g:PAL.goldD,s:PAL.steel,S:PAL.steelL,d:PAL.steelD,k:PAL.iron,I:PAL.ice,i:PAL.iceD,w:PAL.wood,v:PAL.woodD,f:PAL.skin,
    F:PAL.fire,R:PAL.ember,P:PAL.leaf,p:PAL.leafD,M:PAL.arc,m:PAL.arcD,B:PAL.bone};
  for(let r=rowFrom;r<map.length;r++){const row=map[r];for(let c=0;c<row.length;c++){const ch=row[c];if(ch==='.')continue;g.fillStyle=flash&&ch!=='o'?PAL.white:(col[ch]||sp.a);g.fillRect(x+c,y+r,1,1);}}
}
// sprites are rasterised once per palette and reused with drawImage
const sprCache=new Map();
function spriteImg(map,pk,flash){
  let m=sprCache.get(map); if(!m){m=new Map();sprCache.set(map,m);}
  const key=pk+(flash?'!':''); let c=m.get(key); if(c) return c;
  c=document.createElement('canvas'); c.width=map[0].length; c.height=map.length;
  drawSprite(c.getContext('2d'),map,0,0,pk,0,flash); m.set(key,c); return c;
}
const blit=(map,x,y,pk,flash)=>ctx.drawImage(spriteImg(map,pk,!!flash),x,y);

const artCache=new Map();
function artImg(key,pk,flash){
  if(!ART.ok||!(key in ART.idx)) return null; const id=key+pk+(flash?'!':''); let c=artCache.get(id); if(c) return c;
  const i=ART.idx[key], C=ART.cell; c=document.createElement('canvas'); c.width=C; c.height=C; const g=c.getContext('2d');
  g.drawImage(ART.img[pk],(i%ART.cols)*C,Math.floor(i/ART.cols)*C,C,C,0,0,C,C);
  if(flash){ g.globalCompositeOperation='source-atop'; g.fillStyle='rgba(255,255,255,.7)'; g.fillRect(0,0,C,C); }
  artCache.set(id,c); return c;
}
// draw art into a w×w box; part (0..1) shows only the bottom part (build reveal). Returns false when there is no art.
function drawArt(g,key,pk,x,y,w,flash,part){
  const im=artImg(key,pk,flash); if(!im) return false; const s=g.imageSmoothingEnabled; g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
  if(part!=null&&part<1){ const C=ART.cell, f=1-part; g.drawImage(im,0,C*f,C,C*part,x,y+w*f,w,w*part); }
  else g.drawImage(im,x,y,w,w);
  g.imageSmoothingEnabled=s; return true;
}
// an icon canvas (px pixels square): art when present, else the pixel sprite scaled up
function artIcon(key,map,pk,px,c){
  c=c||document.createElement('canvas'); c.width=px; c.height=px; const g=c.getContext('2d'); g.clearRect(0,0,px,px);
  if(drawArt(g,key,pk,0,0,px)) return c;
  const w=map[0].length,h=map.length,k=Math.max(1,Math.floor(px/Math.max(24,w,h))); g.imageSmoothingEnabled=false; g.setTransform(k,0,0,k,0,0);

let vfxLast=performance.now();

  for(let r=0;r<N;r++) for(let c=0;c<N;c++){const dk=(r+c)%2; ctx.fillStyle=dk?PAL.board.d:PAL.board.l; ctx.fillRect(c*CELL,r*CELL,CELL,CELL);}

  ctx.fillStyle='rgba(255,253,247,.8)'; for(let x=0;x<W;x+=8){ ctx.fillRect(x,hh*CELL-2,4,2); if(N%2) ctx.fillRect(x,(N-hh)*CELL,4,2); }

    ctx.strokeStyle=PAL.gold; ctx.lineWidth=1; ctx.setLineDash([3,2]); ctx.strokeRect(X+1.5,Y+1.5,CELL-3,CELL-3); ctx.setLineDash([]);

    ctx.fillStyle=pv.ok?(pv.mode==='up'?'rgba(255,210,63,.5)':'rgba(95,208,104,.45)'):'rgba(220,60,50,.45)'; ctx.fillRect(X,Y,CELL,CELL);
    if(pv.mode==='place'){ctx.globalAlpha=0.65; if(!drawArt(ctx,type,'you',X+1,Y-1,30)) blit(iconMap(type),X+4,Y+4,'you'); ctx.globalAlpha=1;}
    const rg=TOWERS[type].range+(pv.mode==='up'&&tw?0.25*tw.lvl:0); if(rg) ring(X+CELL/2,Y+CELL/2,rg*CELL,'rgba(255,247,224,.75)');
    if(type==='banner'&&(pv.mode==='place'?pv.ok:tw&&tw.side===ME&&tw.type==='banner')) drawRoute(flagRoute(ME,r,c,pv.mode==='place'));
    showPreviewToast(pv.ok?(pv.mode==='up'&&tw?`강화 Lv${tw.lvl+1}`:null):pv.why,r,c);
  }} else if(!S.hover) hideToastIfPreview();
  // selected tower
  if(S.menuTower){const t=S.menuTower,X=vx(t.c)*CELL,Y=vy(t.r)*CELL,rg=TOWERS[t.type].range+0.25*(t.lvl-1); ctx.fillStyle='rgba(255,210,63,.35)';ctx.fillRect(X,Y,CELL,CELL); if(rg) ring(X+CELL/2,Y+CELL/2,rg*CELL,'rgba(255,247,224,.75)');}

  { const f=flagOf(ME); if(f&&(S.menuTower===f||S.t-f.built<3)) drawRoute(flagRoute(ME,f.r,f.c,false)); }
  vfxDraw('ground');
  // kings
  for(const side of ['you','foe']){const k=S.kings[side],X=vx(k.cell[1])*CELL,Y=vy(k.cell[0])*CELL,fl=S.t-(k.hitAt??-9)<0.1;
    if(!drawArt(ctx,'king',pal(side),X+1+(fl?jit():0),Y-1,30,fl)) blit(SPR.king,X+2+(fl?jit():0),Y+(side===ME?2:1),pal(side),fl);
    ctx.fillStyle=PAL.o;ctx.fillRect(X+2,Y+CELL-2,CELL-4,2);ctx.fillStyle=PAL.gold;ctx.fillRect(X+2,Y+CELL-2,px((CELL-4)*Math.max(0,k.hp/k.max)),2);}

  const drawT=t=>{const X=vx(t.c)*CELL,Y=vy(t.r)*CELL,fl=S.t-t.hitAt<0.1, def=TOWERS[t.type];
    drawTowerAt(t,X+4+(fl?jit():0),Y+4,anim,fl);

    const x0=LX(t.c), y0=LY(t.r)-14, x1=LX(g.px+(g.x-g.px)*alpha), y1=LY(g.py+(g.y-g.py)*alpha)-2, w=1+Math.floor(t.ramp||0), dx=x1-x0, dy=y1-y0, L=Math.max(1,Math.round(Math.max(Math.abs(dx),Math.abs(dy))));
    const fl=(Math.floor(performance.now()/60)%2);
    for(let k=0;k<=L;k++){ const X=Math.round(x0+dx*k/L), Y=Math.round(y0+dy*k/L); ctx.fillStyle=PAL.ember; ctx.fillRect(X-w,Y-w,2*w+1,2*w+1); }
    for(let k=0;k<=L;k++){ const X=Math.round(x0+dx*k/L), Y=Math.round(y0+dy*k/L); ctx.fillStyle=fl?PAL.white:PAL.gold; ctx.fillRect(X-(w>2?1:0),Y-(w>2?1:0),w>2?3:1,w>2?3:1); }
    ctx.fillStyle=PAL.white; pixDisc(x1,y1,1+Math.floor(w/2)); }
  // meteors on their way: a warning ring, then the rock coming down
  for(const b of S.bombs){ const q=Math.max(0,Math.min(1,(S.tick+alpha-b.t0)/Math.max(1,b.at-b.t0))), X=LX(b.x), Y=LY(b.y), r=b.r*CELL;
    ctx.globalAlpha=0.35+0.4*q; pixRing(X,Y,r*(1.15-0.15*q),b.side===ME?PAL.gold:PAL.ember,2); ctx.globalAlpha=0.12+0.15*q; ctx.fillStyle=PAL.ember; pixDisc(X,Y,Math.round(r*q)); ctx.globalAlpha=1;
    if(q>0.35){ const f=(q-0.35)/0.65, mx=Math.round(X+(1-f)*60), my=Math.round(Y-(1-f)*120); ctx.fillStyle=PAL.o; pixDisc(mx,my,6); ctx.fillStyle=PAL.ember; pixDisc(mx,my,5); ctx.fillStyle=PAL.fire; pixDisc(mx-1,my-1,3);

  const blink=Math.floor(performance.now()/120)%2;
  for(const s of sold){const fr=soldierFrames(s.type,pal(s.side)),step=s.moving?(Math.floor(S.t*5+s.ph)%2):0,map=fr[step],art=artImg(s.type,pal(s.side)),az=ART_SZ[s.type]||22,w=art?az:map[0].length,h=art?az:map.length,fl=S.t-s.hitAt<0.1;
    const ix=s.px+(s.x-s.px)*alpha, iy=s.py+(s.y-s.py)*alpha, x=px(LX(ix)-w/2)+(fl?jit():0), y=px(LY(iy)-h/2-(art?2+step:0));
    if(s.skel) ctx.globalAlpha=0.72;
    if(art) drawArt(ctx,s.type,pal(s.side),x,y,w,fl); else blit(map,x,y,pal(s.side),fl); ctx.globalAlpha=1;

    if(s.brnT>0){ ctx.fillStyle=blink?PAL.fire:PAL.gold; ctx.fillRect(x+1,y-3+blink,1,2); ctx.fillRect(x+w-2,y-2-blink,1,2); }

// ---- HUD ----
const $=id=>document.getElementById(id);
const segs=[]; for(let i=0;i<10;i++){const d=document.createElement('div');d.className='seg';d.appendChild(document.createElement('i'));$('segs').appendChild(d);segs.push(d);}
const segF=new Array(10).fill(-1);
function pendCost(){ if(MODE!=='pvp'||!NET) return 0; let s=0; for(const p of NET.pend) if(p.tick>S.tick) s+=p.cost; return s; }
function availMana(){ return S.mana[ME]-pendCost(); }
function hud(){
  const mk=S.kings[ME], ok=S.kings[OPP];
  $('hpYou').style.width=Math.max(0,mk.hp/mk.max*100)+'%';
  $('hpFoe').style.width=Math.max(0,ok.hp/ok.max*100)+'%';
  $('hpYouN').textContent=Math.max(0,Math.ceil(mk.hp));
  $('hpFoeN').textContent=Math.max(0,Math.ceil(ok.hp));
  const m=Math.max(0,availMana()), n=Math.floor(m);
  // each segment fills smoothly with the fractional mana (mana regenerates every tick)
  segs.forEach((d,i)=>{ const f=Math.round(Math.max(0,Math.min(1,m-i))*1000)/10; if(f===segF[i]) return; segF[i]=f; d.firstChild.style.width=f+'%'; d.classList.toggle('on',f>=100); });
  $('manaN').textContent=n;
  const el=Math.floor(S.t), mm=Math.floor(el/60), ss=el%60;
  const tm=$('timer'); tm.firstChild.textContent=`${mm}:${String(ss).padStart(2,'0')}`; tm.classList.toggle('sd',S.boost>1);
  const waiting=MODE==='pvp'&&NET&&NET.state==='play'&&NET.stallSince&&performance.now()-NET.stallSince>600;
  $('timerSub').textContent=waiting?'WAITING':S.wave===0?'READY':`${SOLDIER_BOOST?'BOOST':'MANA'} x${S.boost}`;
  const wt=Math.ceil(S.waveTimer);
  $('waveL').textContent= S.wave===0?`첫 웨이브 ${wt}s · 강화 선택`:`웨이브 ${S.wave} · 다음 ${wt}s`;
  const rf=MODE==='pvp'?uiRf:S.reinforce[ME];
  for(const b of document.querySelectorAll('.rb')) b.classList.toggle('sel',rf===b.dataset.t);
  for(const b of cardsEl.querySelectorAll('.card[data-k]')){b.classList.toggle('poor',m<TOWERS[b.dataset.k].cost);b.classList.toggle('sel',S.sel===b.dataset.k);}
  const pb=$('pauseBtn'), np=MODE==='pvp'||!!(CTX&&CTX.noPause); pb.textContent=S.running||np?'II':'>'; pb.disabled=np;
}

let AC=null, muted=false; const lastSfx={};
function audioInit(){ try{ if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();} if(AC.state==='suspended') AC.resume(); }catch(e){} }
function tone(freq,dur,type,vol,slide,when){ if(!AC||muted) return; try{ const o=AC.createOscillator(),g=AC.createGain(); o.type=type||'square'; const t0=AC.currentTime+(when||0);
  o.frequency.setValueAtTime(freq,t0); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
  g.gain.setValueAtTime(vol||0.07,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur); o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0+dur+0.02);}catch(e){} }
function sfx(name){ const now=performance.now(); if(lastSfx[name]&&now-lastSfx[name]<70) return; lastSfx[name]=now;
  switch(name){
    case 'place': tone(440,0.06,'square',0.07); tone(660,0.08,'square',0.07,null,0.06); break;
    case 'sell': tone(600,0.08,'square',0.06,300); break;
    case 'error': tone(160,0.1,'square',0.06,120); break;
    case 'hit': tone(220,0.04,'triangle',0.045,120); break;
    case 'fire': tone(150,0.07,'square',0.05,90); break;
    case 'boom': tone(90,0.2,'sawtooth',0.08,35); break;
    case 'death': tone(300,0.15,'sawtooth',0.05,80); break;
    case 'kinghit': tone(110,0.22,'square',0.1,60); break;
    case 'wave': tone(523,0.08,'square',0.06); tone(784,0.12,'square',0.06,null,0.09); break;
    case 'zap': tone(1400,0.06,'sawtooth',0.035,500); tone(900,0.05,'square',0.03,300,0.04); break;
    case 'snipe': tone(1800,0.03,'square',0.05,200); tone(120,0.12,'triangle',0.05,60,0.02); break;
    case 'pellet': tone(900,0.025,'square',0.025,600); break;
    case 'spike': tone(520,0.04,'triangle',0.04,260); break;
    case 'slash': tone(700,0.06,'sawtooth',0.04,180); break;
    case 'bounce': [500,640,800].forEach((f,i)=>tone(f,0.04,'square',0.035,null,i*0.07)); break;
    case 'meteor': tone(420,0.5,'sawtooth',0.04,90); break;
    case 'hole': tone(180,0.6,'sine',0.08,60); tone(90,0.6,'triangle',0.05,40); break;
    case 'freeze': tone(1600,0.12,'triangle',0.05,800); tone(2200,0.1,'sine',0.04,1200,0.06); break;
    case 'thunder': tone(80,0.3,'sawtooth',0.09,40); tone(1200,0.05,'square',0.04,300); break;
    case 'heal': [660,880,1100].forEach((f,i)=>tone(f,0.08,'sine',0.05,null,i*0.06)); break;
    case 'flame': tone(160,0.18,'sawtooth',0.05,110); break;
    case 'chest': [392,523,659].forEach((f,i)=>tone(f,0.1,'square',0.06,null,i*0.08)); break;
    case 'legend': [523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,0.14,'square',0.07,null,i*0.08)); break;
    case 'unlock': [523,659,784,1047,1319].forEach((f,i)=>tone(f,0.12,'square',0.07,null,i*0.09)); break;
    case 'levelup': tone(660,0.08,'square',0.07); tone(990,0.14,'square',0.07,null,0.08); break;
    case 'win': [523,659,784,1047].forEach((f,i)=>tone(f,0.16,'square',0.08,null,i*0.12)); break;
    case 'lose': [392,330,262,196].forEach((f,i)=>tone(f,0.2,'sawtooth',0.07,null,i*0.15)); break;
  }}

const ghost=$('ghost'), gctx=ghost.querySelector('canvas').getContext('2d');
function ghostShow(type,x,y){gctx.setTransform(1,0,0,1,0,0);artIcon(type,iconMap(type),'you',96,gctx.canvas);ghost.style.display='block';ghost.style.transform=`translate(${x-24}px,${y-24}px)`;}

// screen cell under a point, then mapped back to the simulation cell
function cellFromPoint(clientX,clientY){const rect=cv.getBoundingClientRect(); if(clientX<rect.left||clientX>rect.right||clientY<rect.top||clientY>rect.bottom) return null;
  const r=Math.min(N-1,Math.floor((clientY-rect.top)/rect.height*N)), c=Math.min(N-1,Math.floor((clientX-rect.left)/rect.width*N));
  return FLIP?{r:N-1-r,c:N-1-c}:{r,c};}
const touchOffset=(e)=>e.pointerType==='touch'?cv.getBoundingClientRect().width/N*1.5:0;

// ---- local actions: applied at once against the AI, sent as timed orders in a friend match ----
function doPlace(type,r,c){
  if(!S.running||S.over) return false;
  const pv=previewState(ME,type,r,c,availMana());
  if(!pv.ok){ toast(pv.why); sfx('error'); return false; }
  if(MODE==='pvp'){ const T=issue(1,TKEYS.indexOf(type),r,c); if(T==null) return false; NET.pend.push({tick:T,cost:TOWERS[type].cost,type,r,c,mode:pv.mode}); sfx('place'); return true; }
  return place(ME,type,r,c);
}
function doUpgrade(t){
  const def=TOWERS[t.type];
  if(t.lvl>=3||availMana()<def.cost){ toast(t.lvl>=3?'최대 레벨입니다':'마나 부족'); sfx('error'); return false; }
  if(MODE==='pvp'){ const T=issue(2,t.r,t.c); if(T==null) return false; NET.pend.push({tick:T,cost:def.cost,type:t.type,r:t.r,c:t.c,mode:'up'}); sfx('place'); return true; }
  return upgrade(ME,t);
}
function doSell(t){ if(MODE==='pvp'){ issue(3,t.r,t.c); return; } sellTower(ME,t); }
function doRf(type){
  if(!S.running||S.over) return;
  const cur=MODE==='pvp'?uiRf:S.reinforce[ME], v=cur===type?null:type;
  if(MODE==='pvp'){ uiRf=v; issue(4,v?UKEYS.indexOf(v):-1); } else S.reinforce[ME]=v;
  sfx('place');
}

let drag=null;
cardsEl.addEventListener('pointerdown',e=>{const card=e.target.closest('.card'); if(!card||!S.running||S.over) return; e.preventDefault();
  closeMenu(); drag={type:card.dataset.k,x0:e.clientX,y0:e.clientY,t0:performance.now(),moved:false,pid:e.pointerId,el:card}; try{card.setPointerCapture(e.pointerId);}catch(err){}});
cardsEl.addEventListener('pointermove',e=>{ if(!drag||e.pointerId!==drag.pid) return; if(Math.abs(e.clientX-drag.x0)+Math.abs(e.clientY-drag.y0)>8) drag.moved=true; if(!drag.moved) return;
  const cell=cellFromPoint(e.clientX,e.clientY-touchOffset(e));
  if(cell){S.hover={...cell,type:drag.type};ghostHide();} else {S.hover=null;ghostShow(drag.type,e.clientX,e.clientY);} });
function endDrag(e,cancel){ if(!drag||e.pointerId!==drag.pid) return; const d=drag; drag=null; ghostHide();
  if(cancel){S.hover=null;return;}
  if(!d.moved&&performance.now()-d.t0<400){ S.sel=S.sel===d.type?null:d.type; S.hover=null; return; }
  const cell=cellFromPoint(e.clientX,e.clientY-touchOffset(e));
  if(cell) doPlace(d.type,cell.r,cell.c);
  S.hover=null; }
cardsEl.addEventListener('pointerup',e=>endDrag(e,false));
cardsEl.addEventListener('pointercancel',e=>endDrag(e,true));

let bp=null, lpT=null;
cv.addEventListener('pointerdown',e=>{ if(!S.running||S.over) return; e.preventDefault();
  const cell=cellFromPoint(e.clientX,e.clientY); if(!cell) return;
  bp={x0:e.clientX,y0:e.clientY,t0:performance.now(),pid:e.pointerId,moved:false,cell};
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  if(S.sel){ S.hover={...(cellFromPoint(e.clientX,e.clientY-touchOffset(e))||cell),type:S.sel}; }
  else { const t=towerAt(cell.r,cell.c); closeMenu(); if(t&&t.side===ME){ clearTimeout(lpT); lpT=setTimeout(()=>{ if(bp&&!bp.moved){openMenu(t);bp=null;} },380); } }
});
cv.addEventListener('pointermove',e=>{
  if(bp&&e.pointerId===bp.pid){ if(Math.abs(e.clientX-bp.x0)+Math.abs(e.clientY-bp.y0)>8){bp.moved=true;clearTimeout(lpT);} if(S.sel){const cell=cellFromPoint(e.clientX,e.clientY-touchOffset(e)); S.hover=cell?{...cell,type:S.sel}:null;} return; }
  if(e.pointerType==='mouse'&&S.sel&&!drag){const cell=cellFromPoint(e.clientX,e.clientY); S.hover=cell?{...cell,type:S.sel}:null;}
});

cv.addEventListener('pointerup',e=>{ if(!bp||e.pointerId!==bp.pid) return; clearTimeout(lpT); const b=bp; bp=null;
  if(S.sel){ const cell=cellFromPoint(e.clientX,e.clientY-touchOffset(e))||b.cell; if(doPlace(S.sel,cell.r,cell.c)) S.sel=null; S.hover=null; return; }
  if(!b.moved){ const t=towerAt(b.cell.r,b.cell.c); if(t&&t.side===ME) openMenu(t); else if(t) toast('상대 타워입니다'); }
});

// ---- friend match over the artifact's room (presence only: whole-object, re-sent, so a dropped update is never lost) ----
// Lockstep: both screens run the same seeded simulation. An order made at tick k runs at tick k+D on both.
// Each side publishes a frontier f (no more orders from me up to tick f); a screen only steps to ticks the
// other side has promised, and every order stays in presence until the other side acknowledges it.
let ROOM;   // undefined while checking, null when this view cannot use rooms
// transport: the Claude artifact room by default; a standalone build sets window.TC_ROOM_PROVIDER (same interface)
const PROVIDER=typeof window.TC_ROOM_PROVIDER==='function'?window.TC_ROOM_PROVIDER:null;
const TXT=Object.assign({
  unavail:'Claude에 로그인한 상태로, 초대받은 이 페이지를 웹 브라우저에서 열어야 친구와 연결됩니다.',
  friendNote:'친구도 Claude에 로그인한 상태로, 공유받은 이 페이지를 열어야 합니다.',
  connPerm:'Claude에 로그인한 상태로, 초대받은 이 페이지를 웹 브라우저에서 열어 주세요.',
},window.TC_TEXT||{});
const DIAG={via:PROVIDER?'firebase':'claude',claude:PROVIDER?!!window.firebase:!!(window.claude&&typeof window.claude.use==='function'),ms:null,err:null,join:null};
const roomT0=performance.now();
const roomP=PROVIDER
  ? Promise.resolve().then(()=>PROVIDER()).then(r=>{ROOM=r||null;DIAG.ms=Math.round(performance.now()-roomT0);},e=>{ROOM=null;DIAG.ms=Math.round(performance.now()-roomT0);DIAG.err=String((e&&e.code)||e);})
  : DIAG.claude
  ? window.claude.use('room').then(r=>{ROOM=r||null;DIAG.ms=Math.round(performance.now()-roomT0);},e=>{ROOM=null;DIAG.ms=Math.round(performance.now()-roomT0);DIAG.err=String((e&&e.code)||e);})
  : Promise.resolve().then(()=>{ROOM=null;});
async function permState(){ if(PROVIDER) return '-'; if(!DIAG.claude) return 'none'; try{ const p=await window.claude.use('permissions'); if(!p) return 'n/a'; return await p.state('room'); }catch(e){ return 'err'; } }
async function diagLine(){ const ps=await permState(); return `진단: ${DIAG.via} ${DIAG.claude?'있음':'없음'} · room ${ROOM?'있음':'없음'}${DIAG.ms!=null?` ${(DIAG.ms/1000).toFixed(1)}s`:''}${DIAG.err?` · ${DIAG.err}`:''} · 권한 ${ps}${DIAG.join?` · 입장 ${DIAG.join}`:''}`; }
async function showUnavailable(){

let NET=null, uiRf=null;
const NET_D=8, NET_SEND_MS=window.TC_NET_SEND_MS||45;
const CODE_CH='abcdefghjkmnpqrstuvwxyz23456789';
const genCode=()=>Array.from({length:4},()=>CODE_CH[Math.floor(Math.random()*CODE_CH.length)]).join('');
function newNet(role,room,code){ return {role,room,code,kind:'friend',n:10,myDk:null,myLv:null,oppDk:null,oppLv:null,oppName:'',state:'init',match:0,seed:0,D:NET_D,myPeer:null,oppPeer:null,goneAt:0,joinedAt:performance.now(),unsubs:[],
  seq:0,mine:[],peerAck:0,oppAckOfMine:0,peerF:-1,q:new Map(),pend:[],hashes:new Map(),peerHashes:new Map(),lastHash:null,desync:false,dirty:false,lastSend:0,stallSince:0,myRm:0,oppRm:0}; }

async function connErr(e){

async function createRoom(){
  const code=genCode();
  panel({title:'방 만드는 중…',buttons:[{id:'btnBack',label:'취소',onClick:showFriend}]});
  const seq=PANELSEQ; let room;
  try{ room=await ROOM.join('tc-'+code); }catch(e){ if(seq===PANELSEQ) connErr(e); return; }
  if(seq!==PANELSEQ){ room.leave().catch(()=>{}); return; }
  NET=newNet('h',room,code); NET.match=1; NET.seed=newSeed(); NET.state='wait'; netLoadout(NET,'friend');
  NET.unsubs.push(room.onPeers(onPeersChange,onRoomErr));
  setPres({v:1,r:'h',m:1,sd:NET.seed,st:'wait',...netCard(NET)});
  showHostWait();
}

}
const inviteLink=code=>location.origin+location.pathname+'?room='+code.toUpperCase();

  if(!NET) return; const code=PROVIDER?inviteLink(NET.code):NET.code.toUpperCase();

  try{ navigator.clipboard.writeText(code).then(()=>toast(PROVIDER?'초대 링크를 복사했습니다':'코드를 복사했습니다'),fallback); }catch(e){ fallback(); }
}
async function joinRoom(raw){

const UNLOCK_AT={bb:1, banner:2, spikes:3, shrine:4, crossbow:5, thornwall:6, lightning:7, drum:8,
  firesp:9, mortar:10, sniper:11, mushroom:12, bounce:13, statue:14, jelly:15, well:16, icesp:17, mine:18, battery:19,
  laser:20, skelmage:21, barracks:22, sapling:23, octopus:24, tomb:25, meteor:26, gate:27, catapult:28, toad:29, rocket:30};

// cards needed for the next level, by rarity (rarer towers need fewer cards); gold is the same for all
const LV_CARDS={c:[0,2,4,10,20,50,100,200,400,800], r:[0,1,2,5,10,25,50,100,200,400], e:[0,1,1,2,4,10,20,40,80,160], l:[0,1,1,1,2,4,8,16,32,64]};
const LV_GOLD=[0,20,50,150,400,1000,2000,4000,8000,20000];
const needCards=k=>LV_CARDS[TOWERS[k].rar];
// chests: card count and kinds; kinds are drawn by rarity weight, rarer kinds give fewer cards; leg = chance of one legendary card
const CHESTS={wood:{name:'나무 상자',cards:8,kinds:2,gold:20,gem:10,leg:0.02}, silver:{name:'은 상자',cards:20,kinds:3,gold:60,gem:30,leg:0.06}, gold:{name:'금 상자',cards:50,kinds:4,gold:200,gem:80,leg:0.15}};
const RAR_W={c:6,r:3,e:1.5}, RAR_CARD={c:1,r:0.5,e:0.25,l:0.1};
const TIX={normal:{name:'일반',gem:5}, gold:{name:'골드',gem:15}, dia:{name:'다이아',gem:40}, outlaw:{name:'무법전',gem:80}};
const TIERS={normal:{name:'일반 경쟁전',n:7,next:'gold'}, gold:{name:'골드 경쟁전',n:8,next:'dia'}, dia:{name:'다이아 경쟁전',n:10,next:'outlaw'}};
const stageSize=n=>n<=3?6:n<=6?7:n<=9?8:n<=12?9:10;

// stage n: board size, AI deck (arrow + the tower this stage unlocks + others unlocked by then), AI card level and thinking speed
function stageDef(n){
  const pool=TKEYS.filter(k=>BASIC.includes(k)||(UNLOCK_AT[k]&&UNLOCK_AT[k]<=n));
  let deck=pool.slice();
  if(pool.length>6){ const r=mulberry32(n*7919), newest=UNLOCK_BY[n], rest=pool.filter(k=>k!=='arrow'&&k!==newest);
    for(let i=rest.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]];}
    deck=['arrow']; if(newest) deck.push(newest);
    for(const k of rest){ if(deck.length>=6) break; deck.push(k); }
    // at least three towers that hit soldiers
    for(let i=deck.length-1;i>=0&&deck.filter(isAtk).length<3;i--){ if(deck[i]==='arrow'||deck[i]===newest||isAtk(deck[i])) continue; const sub=rest.find(k=>isAtk(k)&&!deck.includes(k)); if(sub) deck[i]=sub; } }
  const aiLv=1+Math.floor((n-1)/5), lv={}; for(const k of deck) lv[k]=aiLv;
  return {n,size:stageSize(n),deck,lv,aiLv,aiSlow:Math.round((1.8-(n-1)/29)*1000)/1000,kingHp:Math.min(KING_HP,300+25*n),aiCap:n<20?2+n:0,unlock:UNLOCK_BY[n]||null};
}

// ---- profile ----
const NAME_A=['붉은','푸른','황금','은빛','검은','하얀','작은','거친'], NAME_B=['궁수','기사','성주','포병','마법사','창병','척후','방패'];
const randName=()=>NAME_A[Math.floor(Math.random()*NAME_A.length)]+NAME_B[Math.floor(Math.random()*NAME_B.length)]+Math.floor(10+Math.random()*90);
function defaultProfile(){ const cards={}; for(const k of BASIC) cards[k]={l:1,n:0}; return {v:1,name:randName(),gold:100,gems:50,stage:0,cards,deck:BASIC.slice(),tix:{normal:0,gold:0,dia:0,outlaw:0},best:{},claimed:{}}; }
function sanitizeProfile(p){
  const o=Object.assign(defaultProfile(),p);
  o.cards=Object.assign({},o.cards); for(const k of BASIC) if(!o.cards[k]) o.cards[k]={l:1,n:0};
  for(const k of Object.keys(o.cards)){ if(!TOWERS[k]){ delete o.cards[k]; continue; } const c=o.cards[k]; o.cards[k]={l:Math.max(1,Math.min(MAX_LV,c.l|0||1)),n:Math.max(0,c.n|0)}; }
  o.gold=Math.max(0,o.gold|0); o.gems=Math.max(0,o.gems|0); o.stage=Math.max(0,Math.min(STAGE_COUNT,o.stage|0));
  // stages already cleared give their towers (profiles from before the 40-tower roster)
  for(let s=1;s<=o.stage;s++){ const u=UNLOCK_BY[s]; if(u&&!o.cards[u]) o.cards[u]={l:1,n:0}; }
  o.deck=[...new Set((o.deck||[]).filter(k=>o.cards[k]))].slice(0,6); if(!o.deck.length) o.deck=BASIC.slice();
  o.tix=Object.assign({normal:0,gold:0,dia:0,outlaw:0},o.tix||{}); for(const k in o.tix) o.tix[k]=Math.max(0,o.tix[k]|0);
  o.name=String(o.name||randName()).slice(0,12); o.best=o.best||{}; o.claimed=o.claimed||{};
  return o;
}
function loadProfile(){ try{ const raw=localStorage.getItem(PKEY); if(raw){ const p=JSON.parse(raw); if(p&&p.v===1) return sanitizeProfile(p); } }catch(e){} return defaultProfile(); }
let P=loadProfile();
function saveP(){ try{ localStorage.setItem(PKEY,JSON.stringify(P)); }catch(e){} }
const myLv=()=>{ const o={}; for(const k in P.cards) o[k]=P.cards[k].l; return o; };
const avgLv=()=>{ const d=P.deck; return Math.max(1,Math.round(d.reduce((a,k)=>a+(P.cards[k]?P.cards[k].l:1),0)/Math.max(1,d.length))); };
function randomDeck(){ const pool=TKEYS.slice(); for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];} return fixAtk(pool.slice(0,6)); }
function fixAtk(d){ d=[...new Set(d)].slice(0,6); for(const k of ['arrow','cannon']){ if(d.filter(isAtk).length>=2) break; if(!d.includes(k)){ const i=d.findIndex(x=>!isAtk(x)); if(i>=0) d[i]=k; else if(d.length<6) d.push(k); } } return [...new Set(d)]; }

// ---- periods (Korean time): week = ISO week starting Monday 00:00, day = date ----
const KST=9*3600e3;
function dayId(off=0){ return new Date(Date.now()+KST+off*864e5).toISOString().slice(0,10); }
function weekId(off=0){ const k=new Date(Date.now()+KST+off*7*864e5), d=new Date(Date.UTC(k.getUTCFullYear(),k.getUTCMonth(),k.getUTCDate())); const dn=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-dn);
  const y0=new Date(Date.UTC(d.getUTCFullYear(),0,1)); return d.getUTCFullYear()+'-W'+String(Math.ceil(((d-y0)/864e5+1)/7)).padStart(2,'0'); }
// today's outlaw deck: the same six for everyone, picked from the date
function outlawDeck(day){ day=day||dayId(); let hh=2166136261>>>0; for(const ch of day) hh=Math.imul(hh^ch.charCodeAt(0),16777619)>>>0;
  const r=mulberry32(hh), pool=TKEYS.slice(); for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];} return fixAtk(pool.slice(0,6)); }
// what I bring to a match of this kind (friend / normal / gold / dia / outlaw)
function metaLoadout(kind){
  if(kind==='outlaw'){ const deck=outlawDeck(), lv={}; for(const k of deck) lv[k]=OUTLAW_LV; return {n:10,deck,lv,name:P.name}; }
  const deck=P.deck.slice(), all=myLv(), lv={}; for(const k of deck) lv[k]=all[k]||1;
  return {n:TIERS[kind]?TIERS[kind].n:10,deck,lv,name:P.name};
}

// ---- rewards ----
const newOut=()=>({gold:0,gems:0,cards:{},chests:[],tix:{},unlock:null,legend:null,newLegend:false});
function addUnlock(k){ P.cards[k]={l:1,n:0}; if(P.deck.length<6&&!P.deck.includes(k)) P.deck.push(k); }
function openChest(type,out){
  const c=CHESTS[type], avail=Object.keys(P.cards).filter(k=>TOWERS[k].rar!=='l'), kinds=[];
  // kinds drawn by rarity weight, without repeats
  for(let i=0;i<c.kinds&&avail.length;i++){ let tot=0; for(const k of avail) tot+=RAR_W[TOWERS[k].rar]; let x=Math.random()*tot, j=0;
    for(;j<avail.length-1;j++){ x-=RAR_W[TOWERS[avail[j]].rar]; if(x<=0) break; } kinds.push(avail.splice(j,1)[0]); }
  let left=c.cards;
  kinds.forEach((k,i)=>{ const n=i===kinds.length-1?left:Math.min(left-(kinds.length-1-i),Math.max(1,Math.round(left*(0.25+Math.random()*0.3)))); left-=n;
    const got=Math.max(1,Math.round(n*RAR_CARD[TOWERS[k].rar])); P.cards[k].n+=got; out.cards[k]=(out.cards[k]||0)+got; });
  if(Math.random()<c.leg){ const k=LEGEND[Math.floor(Math.random()*LEGEND.length)]; out.legend=k;
    if(!P.cards[k]){ addUnlock(k); out.newLegend=true; } else { P.cards[k].n+=1; out.cards[k]=(out.cards[k]||0)+1; } }
  out.gold+=c.gold; out.chests.push(type);
}
function gain(out){ P.gold+=out.gold; P.gems+=out.gems; for(const k in out.tix) P.tix[k]=(P.tix[k]|0)+out.tix[k]; saveP(); }
function stageReward(n,win){
  const out=newOut(); out.tix.normal=1;
  if(win){
    if(n>P.stage){
      P.stage=n; out.first=true;
      const u=UNLOCK_BY[n]; if(u&&!P.cards[u]){ addUnlock(u); out.unlock=u; }
      out.gold+=30+10*n; let tier=n<=10?0:n<=20?1:2; if(n%5===0) tier=Math.min(2,tier+1); openChest(['wood','silver','gold'][tier],out);
    } else out.gold+=5+2*n;
  }
  gain(out); return out;
}
const canLevel=k=>{ const c=P.cards[k]; return !!c&&c.l<MAX_LV&&c.n>=needCards(k)[c.l]&&P.gold>=LV_GOLD[c.l]; };
function levelUp(k){ if(!canLevel(k)) return false; const c=P.cards[k]; c.n-=needCards(k)[c.l]; P.gold-=LV_GOLD[c.l]; c.l++; saveP(); sfx('levelup'); return true; }
const RANK_REW={week:[[1,100,'gold'],[3,60,'gold'],[10,30,'silver'],[50,10,'wood'],[1e9,0,'wood']], day:[[1,50,'gold'],[3,30,'silver'],[10,15,'silver'],[50,5,'wood'],[1e9,0,'wood']]};
function grantRank(kind,rank,per){
  const row=RANK_REW[per].find(r=>rank<=r[0]), mul=kind==='gold'?2:kind==='dia'?3:1, out=newOut();
  out.gems=row[1]*(per==='week'?mul:1); openChest(row[2],out); gain(out); return {kind,rank,out};
}
